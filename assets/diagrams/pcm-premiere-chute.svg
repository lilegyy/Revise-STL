<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Chute libre : une seule force, le poids</title><desc id="desc">Modèle sans frottements : corps lâché sans vitesse initiale ; axe Oz orienté vers le bas.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >PCM · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Chute libre : une seule force, le poids</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Modèle sans frottements : corps lâché sans vitesse initiale ; axe Oz orienté vers le bas.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><path d="M125 211L125 530" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="113" y="199" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#72858d" text-anchor="end" font-weight="400" >O</text><text x="140" y="528" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >z (m)</text><text x="270" y="206" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#28776e" text-anchor="middle" font-weight="700" >masse m</text><text x="516" y="206" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2863b5" text-anchor="middle" font-weight="700" >masse 2m</text><circle cx="270" cy="232" r="14" fill="#e0e9e6" stroke="#28776e" stroke-width="2.5" /><circle cx="516" cy="232" r="18" fill="#e0e9e6" stroke="#2863b5" stroke-width="2.5" /><text x="368" y="238" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="400" >t = 0</text><circle cx="270" cy="257" r="14" fill="#e0e9e6" stroke="#28776e" stroke-width="2.5" /><circle cx="516" cy="257" r="18" fill="#e0e9e6" stroke="#2863b5" stroke-width="2.5" /><text x="368" y="263" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="400" >t = 1Δt</text><circle cx="270" cy="332" r="14" fill="#e0e9e6" stroke="#28776e" stroke-width="2.5" /><circle cx="516" cy="332" r="18" fill="#e0e9e6" stroke="#2863b5" stroke-width="2.5" /><text x="368" y="338" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="400" >t = 2Δt</text><circle cx="270" cy="457" r="14" fill="#e0e9e6" stroke="#28776e" stroke-width="2.5" /><circle cx="516" cy="457" r="18" fill="#e0e9e6" stroke="#2863b5" stroke-width="2.5" /><text x="368" y="463" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="400" >t = 3Δt</text><path d="M270 457L270 500" stroke="#c75454" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><path d="M516 457L516 543" stroke="#c75454" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><text x="293" y="512" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c75454" text-anchor="start" font-weight="700" >P</text><text x="539" y="541" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c75454" text-anchor="start" font-weight="700" >2P</text><rect x="695" y="234" width="405" height="272" rx="12" fill="#f0f6f2" stroke="#dce5df" stroke-width="1.5" /><text x="720" y="272" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#28776e" text-anchor="start" font-weight="400" >a = g : indépendant de m</text><text x="720" y="318" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#28776e" text-anchor="start" font-weight="400" >az = +g</text><text x="720" y="364" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#28776e" text-anchor="start" font-weight="400" >vz(t) = g × t</text><text x="720" y="410" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#28776e" text-anchor="start" font-weight="400" >z(t) = ½ g × t²</text><text x="720" y="456" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#28776e" text-anchor="start" font-weight="400" >Les écarts de positions augmentent.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Poser les hypothèses du modèle</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le système ne subit que son poids.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >t = 0 au lâcher ; z(0) = 0 ; vz(0) = 0.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ici, le bas est le sens positif de l’axe.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Vérifier signes et dimensions</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >a = g ≈ 9,81 m·s⁻² ; m disparaît de l’équation.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Un axe vers le haut donnerait az = −g.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le même g ne signifie pas le même poids.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>