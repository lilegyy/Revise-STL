82L784.0 531Q782.0 541 792.0 541L884.0 541Q894.0 541 892.0 531L852 482L852 445"/></clipPath></defs><rect x="730" y="517.96" width="216" height="96" rx="0" fill="#b6dbe7" stroke="none" stroke-width="1.5" clip-path="url(#erl838445)" fill-opacity=".8"/><path d="M824 445L824 482L784.0 531Q782.0 541 792.0 541L884.0 541Q894.0 541 892.0 531L852 482L852 445" stroke="#72858d" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M799.6203389830508 517.96L876.3796610169492 517.96" stroke="#2863b5" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="79" y="193" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="start" font-weight="700" >Bulbe au départ des vapeurs</text><path d="M79 199L376 231" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="376" cy="231" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="78" y="353" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="700" >Colonne de Vigreux</text><path d="M78 359L360 290" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="360" cy="290" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="80" y="478" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223d43" text-anchor="start" font-weight="700" >Pierre ponce introduite à froid</text><path d="M80 484L355 485" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="355" cy="485" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="985" y="492" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >Récepteur ouvert</text><text x="985" y="520" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="400" >Distillat recueilli</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Régler le montage</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Fixer la verrerie sans la contraindre ; joints adaptés.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Mettre l’eau en circulation avant le chauffage.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Bain chauffant adapté ; jamais de système clos.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Arrêter et identifier les fractions</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ne jamais distiller à sec : laisser un résidu.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Température en tête = indice, pas preuve de pureté.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Contrôler si besoin par CCM, indice ou spectre.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>