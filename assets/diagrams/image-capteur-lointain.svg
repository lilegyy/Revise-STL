<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Angle de champ : focale et largeur du capteur</title><desc id="desc">Objet très lointain : le capteur se trouve près du plan focal image (p′ ≈ f′).</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >SPCL · PREMIÈRE · IMAGE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Angle de champ : focale et largeur du capteur</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Objet très lointain : le capteur se trouve près du plan focal image (p′ ≈ f′).</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><path d="M90 346L1100 346" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arr-gray)" /><text x="1080" y="374" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#72858d" text-anchor="end" font-weight="400" >axe optique →</text><path d="M640 214.0Q613 346 640 478.0Q667 346 640 214.0" stroke="#2863b5" stroke-width="2" fill="url(#glass)" stroke-linejoin="round" stroke-linecap="round" /><path d="M640 208.0L640 484.0" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" marker-start="url(#arr-blue)"/><circle cx="640" cy="346" r="3" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><text x="640" y="195.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="middle" font-weight="700" >Objectif (lentille équivalente)</text><rect x="636" y="479" width="8" height="-1" rx="2" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><rect x="610" y="469" width="60" height="18" rx="4" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><circle cx="655" cy="476" r="4" fill="#fff" stroke="#72858d" stroke-width="2" /><rect x="1031" y="226" width="18" height="240" rx="3" fill="#e4e9e9" stroke="#72858d" stroke-width="1.5" /><path d="M1032 231L1032 461" stroke="#fefefe" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="1036" y="466" width="8" height="12" rx="2" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><rect x="1010" y="469" width="60" height="18" rx="4" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><circle cx="1055" cy="476" r="4" fill="#fff" stroke="#72858d" stroke-width="2" /><text x="1040" y="204" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Capteur</text><rect x="1025" y="260.54545454545456" width="11" height="170.9090909090909" rx="3" fill="#c4ddc8" stroke="#28776e" stroke-width="1.5" /><path d="M135 238.11363636363637L640 346L1040 431.45454545454544" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M397.6 294.2145454545455L438.0 302.8454545454546" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M848.0 390.43636363636364L880.0 397.27272727272725" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M135 453.8863636363636L640 346L1040 260.54545454545456" stroke="#bb7a18" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M397.6 397.7854545454545L438.0 389.1545454545454" stroke="#bb7a18" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><path d="M848.0 301.56363636363636L880.0 294.72727272727275" stroke="#bb7a18" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><path d="M542.207 325.108A100 100 0 0 0 542.207 366.892" stroke="#9064bd" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="512" y="350" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#9064bd" text-anchor="middle" font-weight="700" >α</text><text x="675" y="372" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >O</text><text x="1064" y="372" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >F′</text><path d="M1091 260.54545454545456L1091 431.45454545454544" stroke="#72858d" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" marker-start="url(#arr-gray)"/><text x="1121" y="353" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="middle" font-weight="700" >ℓ</text><text x="94" y="202" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >Limites du champ photographié</text><text x="90" y="508" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >Exemple : f′ = 55 mm ; ℓ = 23,5 mm → α ≈ 24,1°.</text><path d="M640 532L640 548" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M1040 532L1040 548" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M640 540L1040 540" stroke="#72858d" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" marker-start="url(#arr-gray)"/><rect x="791.9" y="515" width="96.2" height="25" rx="4" fill="#fff" stroke="none" stroke-width="1.5" /><text x="840.0" y="534" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="700" >p′ ≈ f′</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Calculer ou mesurer l’angle de champ</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >tan(α / 2) = ℓ / (2f′).</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >α = 2 arctan(ℓ / (2f′)) pour l’objet lointain.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >À petite ouverture angulaire : α ≈ L / D (rad).</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Déduire la largeur du capteur</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >ℓ = 2 f′ × tan(α / 2).</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >f′ et ℓ doivent avoir la même unité.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >f′ augmente → champ plus étroit, à capteur fixe.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Les couleurs distinguent les trajets ou les éléments, pas toujours la couleur de la lumière.</text></svg>