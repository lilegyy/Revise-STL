und" marker-end="url(#arr-teal)" /><rect x="649" y="281" width="8" height="252" rx="2" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><rect x="603" y="529" width="106" height="15" rx="4" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><rect x="630" y="363" width="38" height="26" rx="5" fill="#bacbd3" stroke="#72858d" stroke-width="1.5" /><text x="321" y="203" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="middle" font-weight="700" >Thermomètre : bulbe au bras latéral</text><path d="M321 209L315 269" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="315" cy="269" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="596" y="239" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Sortie d’eau (haut)</text><path d="M596 245L449 262" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="449" cy="262" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="1007" y="348" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="middle" font-weight="700" >Entrée d’eau froide (bas)</text><path d="M1007 354L754 476" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="754" cy="476" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="972" y="208" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Réfrigérant incliné</text><path d="M972 214L591 368" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="591" cy="368" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="1020" y="516" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="middle" font-weight="700" >Distillat : solvant recueilli</text><path d="M1020 522L825 512" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="825" cy="512" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="178" y="551" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="start" font-weight="700" >Chauffage contrôlé</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Séparer grâce à la vaporisation</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Les vapeurs du solvant gagnent le réfrigérant.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le liquide condensé est recueilli dans un autre récipient.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La trimyristine reste dans le ballon d’extraction.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Régler le dispositif</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Bulbe du thermomètre au niveau du départ des vapeurs.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Eau : entrée côté bas, sortie côté haut du réfrigérant.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Montage non clos ; ne pas chauffer à sec.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>