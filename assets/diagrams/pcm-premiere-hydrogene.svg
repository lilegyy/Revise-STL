<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Hydrogène : six niveaux et quatre raies</title><desc id="desc">Énergies relatives à E₁ = 0 eV ; la hauteur des traits est proportionnelle à leur énergie.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker></defs><rect width="1200" height="800" fill="#f4f5f0"/><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd"/><rect x="44" y="160" width="1112" height="406" rx="16" fill="#fff" stroke="#e3e8e7"/><text x="48" y="61" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#28776e">PCM · PREMIÈRE · CORRECTION</text><text x="48" y="104" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#223d43">Hydrogène : six niveaux et quatre raies</text><text x="48" y="139" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#72858d">Énergies relatives à E₁ = 0 eV ; la hauteur des traits est proportionnelle à leur énergie.</text><path d="M235 540L235 175" fill="none" stroke="#2863b5" stroke-width="2" marker-end="url(#arrow)"/><text x="93" y="196" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2863b5">E (eV)</text><path d="M265 530L730 530" fill="none" stroke="#223d43" stroke-width="3" /><path d="M730 530L855 524" fill="none" stroke="#72858d" stroke-width="1.2" /><text x="870" y="530" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#223d43">E1 = 0,000 eV</text><path d="M265 254.60000000000002L730 254.60000000000002" fill="none" stroke="#223d43" stroke-width="2" /><path d="M730 254.60000000000002L855 329" fill="none" stroke="#72858d" stroke-width="1.2" /><text x="870" y="335" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#223d43">E2 = 10,200 eV</text><path d="M265 203.4347942073171L730 203.4347942073171" fill="none" stroke="#223d43" stroke-width="2" /><path d="M730 203.4347942073171L855 294" fill="none" stroke="#72858d" stroke-width="1.2" /><text x="870" y="300" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#223d43">E3 = 12,095 eV</text><path d="M265 185.53750000000002L730 185.53750000000002" fill="none" stroke="#223d43" stroke-width="2" /><path d="M730 185.53750000000002L855 259" fill="none" stroke="#72858d" stroke-width="1.2" /><text x="870" y="265" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#223d43">E4 = 12,758 eV</text><path d="M265 177.2627304147466L730 177.2627304147466" fill="none" stroke="#223d43" stroke-width="2" /><path d="M730 177.2627304147466L855 224" fill="none" stroke="#72858d" stroke-width="1.2" /><text x="870" y="230" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#223d43">E5 = 13,064 eV</text><path d="M265 172.73567073170733L730 172.73567073170733" fill="none" stroke="#223d43" stroke-width="2" /><path d="M730 172.73567073170733L855 189" fill="none" stroke="#72858d" stroke-width="1.2" /><text x="870" y="195" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#223d43">E6 = 13,232 eV</text><path d="M340 206.4347942073171L340 250.60000000000002" fill="none" stroke="#c75454" stroke-width="2.5" marker-end="url(#arrow)"/><text x="340" y="390" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#c75454">3 → 2</text><text x="340" y="420" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#c75454">656 nm</text><path d="M445 188.53750000000002L445 250.60000000000002" fill="none" stroke="#2863b5" stroke-width="2.5" marker-end="url(#arrow)"/><text x="445" y="390" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2863b5">4 → 2</text><text x="445" y="420" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2863b5">486 nm</text><path d="M550 180.2627304147466L550 250.60000000000002" fill="none" stroke="#9064bd" stroke-width="2.5" marker-end="url(#arrow)"/><text x="550" y="390" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#9064bd">5 → 2</text><text x="550" y="420" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#9064bd">434 nm</text><path d="M655 175.73567073170733L655 250.60000000000002" fill="none" stroke="#663b9e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="655" y="390" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#663b9e">6 → 2</text><text x="655" y="420" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#663b9e">410 nm</text><text x="288" y="469" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#28776e">Chaque photon emporte Eₙ − E₂ &gt; 0.</text><rect x="44" y="587" width="550" height="156" rx="3" fill="#f1f6f3" stroke="#d7e2dc"/><text x="64" y="621" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#28776e">Construire sur papier</text><text x="64" y="650" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#223d43">À l’échelle 1 cm pour 1 eV :</text><text x="64" y="679" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#223d43">E₂ à 10,2 cm ; E₆ à ≈13,23 cm.</text><text x="64" y="708" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#223d43">Ne pas espacer uniformément les niveaux.</text><rect x="606" y="587" width="550" height="156" rx="3" fill="#f1f6f3" stroke="#d7e2dc"/><text x="626" y="621" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#28776e">Calculer une raie</text><text x="626" y="650" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#223d43">Eₙ = E₂ + hc / λₙ→₂ (en J puis eV).</text><text x="626" y="679" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#223d43">c = 3,00 × 10⁸ m/s ; h = 6,63 × 10⁻³⁴ J·s.</text><text x="626" y="708" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#223d43">Les courtes λ correspondent aux grands écarts.</text><text x="48" y="771" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#72858d">Schéma de correction · Valeurs issues du modèle du sujet, pas d’une mesure de laboratoire.</text></svg>