3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="691" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="middle" font-weight="700" >Sortie d’eau en haut</text><path d="M465 417L465 391" stroke="#bb7a18" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><text x="408" y="445" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#bb7a18" text-anchor="middle" font-weight="400" >vapeurs</text><path d="M510 385L510 411" stroke="#2863b5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="613" y="403" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="middle" font-weight="700" >condensat ↓</text><rect x="429" y="514" width="162" height="51" rx="8" fill="#dbe4e7" stroke="#72858d" stroke-width="1.5" /><rect x="424" y="505" width="172" height="10" rx="3" fill="#9badb6" stroke="#72858d" stroke-width="1.5" /><circle cx="562" cy="540" r="12" fill="#fff" stroke="#72858d" stroke-width="2" /><circle cx="453" cy="539" r="4" fill="#c75454" stroke="#c75454" stroke-width="2" /><rect x="473" y="529" width="65" height="23" rx="3" fill="#d7e6c5" stroke="#72858d" stroke-width="1.5" /><text x="108" y="187" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="start" font-weight="700" >Haut du réfrigérant ouvert</text><path d="M108 193L508 185" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="508" cy="185" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="119" y="479" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="start" font-weight="700" >Ballon : réactifs + agitation</text><path d="M119 485L477 453" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="477" cy="453" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="80" y="523" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="start" font-weight="700" >Bain chauffant adapté</text><path d="M80 529L423 481" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="423" cy="481" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><rect x="747" y="237" width="373" height="293" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="765" y="269" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >SUIVRE UNE SYNTHÈSE</text><text x="769" y="301" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Introduire les réactifs à froid.</text><text x="769" y="335" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Adapter le milieu et le catalyseur.</text><text x="769" y="369" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Réguler l’ébullition.</text><text x="769" y="403" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Maintenir un reflux modéré.</text><text x="769" y="437" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Suivre l’évolution, par exemple en CCM.</text><text x="769" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Laisser refroidir avant de démonter.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Accélérer sans enfermer</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le chauffage accélère la cinétique de réaction.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le reflux limite les pertes de substances volatiles.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le haut du montage reste ouvert à l’atmosphère.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Éviter les erreurs</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ne pas ajouter de pierre ponce dans un liquide chaud.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Vérifier tuyaux, débit d’eau et fixation des éléments.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Un reflux prolongé ne garantit ni pureté ni rendement.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>