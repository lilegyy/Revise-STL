 font-weight="400" >Valeur + unité + incertitude et méthode d’évaluation.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Arrondir de façon cohérente avec l’incertitude.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Un affichage de nombreux chiffres ne garantit pas la justesse.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>