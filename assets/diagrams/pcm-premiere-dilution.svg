4" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >F = c₀ / cf = Vf / V₀ ; F &gt; 1 pour une dilution.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Les deux volumes utilisent la même unité.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Les bons gestes</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Rincer la pipette avec un peu de solution mère.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Aspirer avec une propipette, jamais avec la bouche.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Respecter le type de pipette ; finir au ménisque.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>