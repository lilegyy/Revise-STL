<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Énergie cinétique : masse et vitesse</title><desc id="desc">Ec = ½ m v² : la vitesse intervient au carré ; l’énergie est exprimée en joules.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >PCM · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Énergie cinétique : masse et vitesse</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Ec = ½ m v² : la vitesse intervient au carré ; l’énergie est exprimée en joules.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><text x="112" y="211" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#28776e" text-anchor="start" font-weight="700" >MÊME MASSE : VITESSE DOUBLÉE</text><rect x="179" y="297" width="114" height="51" rx="8" fill="#b4ccd3" stroke="#72858d" stroke-width="1.5" /><circle cx="203" cy="352" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="269" cy="352" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="236" cy="328" r="4" fill="#223d43" stroke="#223d43" stroke-width="2" /><rect x="179" y="450" width="114" height="51" rx="8" fill="#b4ccd3" stroke="#72858d" stroke-width="1.5" /><circle cx="203" cy="505" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="269" cy="505" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="236" cy="481" r="4" fill="#223d43" stroke="#223d43" stroke-width="2" /><path d="M323 320L460 320" stroke="#2863b5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="397" y="296" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#2863b5" text-anchor="middle" font-weight="700" >v</text><path d="M323 475L597 475" stroke="#2863b5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="457" y="451" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#2863b5" text-anchor="middle" font-weight="700" >2v</text><path d="M701 495L1113 495" stroke="#72858d" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><path d="M701 495L701 232" stroke="#72858d" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="720" y="243" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="400" >Ec (J)</text><rect x="773" y="435" width="101" height="60" rx="5" fill="#a5cbbc" stroke="#28776e" stroke-width="1.5" /><rect x="955" y="255" width="101" height="240" rx="5" fill="#78a0cd" stroke="#2863b5" stroke-width="1.5" /><text x="824" y="418" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#28776e" text-anchor="middle" font-weight="700" >Ec</text><text x="1005" y="237" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#2863b5" text-anchor="middle" font-weight="700" >4Ec</text><text x="824" y="531" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="middle" font-weight="700" >v</text><text x="1005" y="531" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#2863b5" text-anchor="middle" font-weight="700" >2v</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Dépendance à la vitesse et à la masse</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >v × 2 → Ec × 4 à masse constante.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >m × 2 → Ec × 2 à vitesse constante.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Employer m en kg et v en m·s⁻¹.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Théorème de l’énergie cinétique</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ec(B) − Ec(A) = Σ WAB(F).</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Σ W &gt; 0 : la valeur de la vitesse augmente.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Σ W &lt; 0 : la valeur de la vitesse diminue.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>