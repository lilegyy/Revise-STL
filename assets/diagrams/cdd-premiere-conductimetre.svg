<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Conductimétrie : mesurer une solution ionique</title><desc id="desc">La conductivité dépend des ions, de leurs concentrations et de la température ; la cellule doit être adaptée.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >CDD · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Conductimétrie : mesurer une solution ionique</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >La conductivité dépend des ions, de leurs concentrations et de la température ; la cellule doit être adaptée.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="199" y="196" width="8" height="345" rx="2" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><rect x="152" y="541" width="102" height="14" rx="3" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><rect x="192" y="287" width="22" height="16" rx="3" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><path d="M214 295L479 295" stroke="#72858d" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M475 281Q497 295 475 309" stroke="#72858d" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M393 344L393 524Q393 532 403 532L633 532Q643 532 643 524L643 344" stroke="#72858d" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="396" y="409.8" width="244" height="119.19999999999999" rx="0" fill="#aad8e7" stroke="none" stroke-width="1.5" fill-opacity=".7"/><path d="M396 409.8L640 409.8" stroke="#2863b5" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M625 375.3333333333333L639 375.3333333333333" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M625 406.6666666666667L639 406.6666666666667" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M625 438.0L639 438.0" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M625 469.3333333333333L639 469.3333333333333" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="518.0" y="558" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="middle" font-weight="700" >Solution homogène</text><path d="M478 282L478 452Q478 475 498 475Q518 475 518 452L518 282" stroke="#72858d" stroke-width="2.5" fill="#d7e6eb" stroke-linejoin="round" stroke-linecap="round" /><rect x="481" y="420" width="13" height="34" rx="1" fill="#28776e" stroke="#28776e" stroke-width="1.5" /><rect x="503" y="420" width="12" height="34" rx="1" fill="#28776e" stroke="#28776e" stroke-width="1.5" /><path d="M498 282L498 238Q498 205 558 205L784 205Q822 205 822 255" stroke="#223d43" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="751" y="256" width="315" height="219" rx="15" fill="#e0e7e9" stroke="#72858d" stroke-width="1.5" /><rect x="781" y="284" width="253" height="72" rx="4" fill="#d7e7c2" stroke="#72858d" stroke-width="1.5" /><text x="907" y="329" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="middle" font-weight="700" >σ · unité choisie</text><circle cx="803" cy="413" r="21" fill="#f8fbf8" stroke="#72858d" stroke-width="2" /><text x="803" y="419" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223d43" text-anchor="middle" font-weight="400" >Cal</text><circle cx="884" cy="413" r="21" fill="#f8fbf8" stroke="#72858d" stroke-width="2" /><text x="884" y="419" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223d43" text-anchor="middle" font-weight="400" >Mode</text><circle cx="991" cy="413" r="21" fill="#f8fbf8" stroke="#72858d" stroke-width="2" /><text x="991" y="419" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223d43" text-anchor="middle" font-weight="400" >°C</text><text x="80" y="326" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223d43" text-anchor="start" font-weight="700" >Partie sensible complètement immergée</text><path d="M80 332L494 442" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="494" cy="442" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="82" y="488" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223d43" text-anchor="start" font-weight="700" >Sans bulle ; loin du fond et des parois</text><path d="M82 494L518 449" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="518" cy="449" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="904" y="517" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >Valeur stabilisée + température</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Préparer et mesurer</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Rincer la cellule puis limiter la contamination.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Étalonner avec une solution de référence adaptée.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Attendre la stabilisation ; garder θ maîtrisée.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Garder les grandeurs distinctes</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >G = I/U, en siemens : conductance de la cellule.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >σ = Kcell × G, en S·m⁻¹ : conductivité du milieu.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >L’appareil peut afficher mS·cm⁻¹ : vérifier les unités.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>