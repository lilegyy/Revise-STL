<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"><rect width="1000" height="460" fill="#fffdf7"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#285f65"/></marker></defs><g font-family="sans-serif" font-size="22" fill="#285f65"><text x="40" y="55" font-size="22">Dosage par étalonnage : même longueur d’onde, même protocole</text><rect x="35" y="130" width="240" height="125" rx="12" fill="#e3eeeb" stroke="#285f65" stroke-width="2"/><text x="55" y="170" font-size="22">1 · Préparer</text><text x="55" y="220" font-size="18">Gamme et dilution</text><path d="M283 193L345 193" stroke="#285f65" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="365" y="130" width="240" height="125" rx="12" fill="#e3eeeb" stroke="#285f65" stroke-width="2"/><text x="385" y="170" font-size="22">2 · Mesurer</text><text x="385" y="220" font-size="18">Blanc puis absorbances</text><path d="M613 193L675 193" stroke="#285f65" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="695" y="130" width="240" height="125" rx="12" fill="#e3eeeb" stroke="#285f65" stroke-width="2"/><text x="715" y="170" font-size="22">3 · Exploiter</text><text x="715" y="220" font-size="18">Droite A = aC + b</text><text x="100" y="340" font-size="22">Échantillon dans la gamme : C diluée = (A − b)/a</text><text x="100" y="410" font-size="22">Puis C initiale = facteur de dilution × C diluée</text></g></svg>