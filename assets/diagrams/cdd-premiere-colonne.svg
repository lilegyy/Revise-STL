="round" /><circle cx="374" cy="461" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="398" y="565" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#28776e" text-anchor="middle" font-weight="700" >Écoulement régulier, jamais à sec.</text><rect x="627" y="182" width="502" height="367" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="645" y="214" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >COLLECTER PUIS CONTRÔLER PAR CCM</text><path d="M687 275L687 444Q709 465 731 444L731 275" stroke="#72858d" stroke-width="2" fill="#f9fcfc" stroke-linejoin="round" stroke-linecap="round" /><rect x="691" y="370" width="36" height="72" rx="0" fill="#bb7a18" stroke="none" stroke-width="1.5" fill-opacity=".55"/><text x="709" y="503" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >Fraction 1</text><path d="M842 275L842 444Q864 465 886 444L886 275" stroke="#72858d" stroke-width="2" fill="#f9fcfc" stroke-linejoin="round" stroke-linecap="round" /><rect x="846" y="370" width="36" height="72" rx="0" fill="#dcb46f" stroke="none" stroke-width="1.5" fill-opacity=".55"/><text x="864" y="503" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >Fraction 2</text><path d="M997 275L997 444Q1019 465 1041 444L1041 275" stroke="#72858d" stroke-width="2" fill="#f9fcfc" stroke-linejoin="round" stroke-linecap="round" /><rect x="1001" y="370" width="36" height="72" rx="0" fill="#9064bd" stroke="none" stroke-width="1.5" fill-opacity=".55"/><text x="1019" y="503" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >Fraction 3</text><text x="878" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >Changer le récipient au bon moment</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Préparer une colonne homogène</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Éviter bulles, fissures et canaux préférentiels.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Déposer l’échantillon sans perturber la surface.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ajouter doucement l’éluant ; maintenir la phase mouillée.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Séparer puis identifier</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Les affinités relatives règlent l’ordre d’élution.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ne pas supposer une espèce pure par fraction.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Analyser les fractions avant de les réunir.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>