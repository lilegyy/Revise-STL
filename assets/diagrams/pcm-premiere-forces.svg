<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Bilan des forces : support horizontal ou incliné</title><desc id="desc">Schémas de forces au point G dans le modèle du point matériel ; référentiel terrestre supposé galiléen.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >PCM · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Bilan des forces : support horizontal ou incliné</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Schémas de forces au point G dans le modèle du point matériel ; référentiel terrestre supposé galiléen.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="69" y="182" width="511" height="365" rx="12" fill="#f7faf8" stroke="#e0e7e2" stroke-width="1.5" /><rect x="611" y="182" width="520" height="365" rx="12" fill="#f7faf8" stroke="#e0e7e2" stroke-width="1.5" /><text x="96" y="217" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="start" font-weight="700" >REPOS SUR UN SUPPORT HORIZONTAL</text><path d="M104 411L542 411" stroke="#72858d" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="261" y="326" width="130" height="82" rx="7" fill="#c2d3da" stroke="#72858d" stroke-width="1.5" /><circle cx="326" cy="370" r="4" fill="#223d43" stroke="#223d43" stroke-width="2" /><path d="M326 370L326 258" stroke="#28776e" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><path d="M326 370L326 482" stroke="#c75454" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><text x="352" y="262" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="start" font-weight="700" >N</text><text x="352" y="483" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#c75454" text-anchor="start" font-weight="700" >P = mg</text><text x="305" y="376" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="end" font-weight="400" >G</text><text x="639" y="217" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="start" font-weight="700" >PLAN INCLINÉ SANS FROTTEMENT</text><path d="M659 485L1090 284.48770699335057" stroke="#72858d" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(855 394.0700066597753) rotate(-25)"><rect x="-55" y="-80" width="110" height="80" rx="7" fill="#c2d3da" stroke="#72858d" stroke-width="2"/></g><path d="M838.095269530372 357.8176951783093L838.095269530372 477.8176951783093" stroke="#c75454" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><path d="M838.095269530372 357.8176951783093L792.1326029432333 259.25043859711695" stroke="#28776e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><path d="M838.095269530372 357.8176951783093L792.1326029432333 379.25043859711695" stroke="#bb7a18" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><circle cx="838.095269530372" cy="357.8176951783093" r="4" fill="#223d43" stroke="#223d43" stroke-width="2" /><text x="768.095269530372" y="243.8176951783093" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="start" font-weight="700" >N</text><text x="858.095269530372" y="483.8176951783093" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c75454" text-anchor="start" font-weight="700" >P</text><text x="747.095269530372" y="400.8176951783093" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bb7a18" text-anchor="start" font-weight="700" >ΣF</text><text x="857.095269530372" y="349.8176951783093" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >G</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Décrire chaque force</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Donner agent, direction, sens et valeur si connue.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Poids : vertical, vers le bas, P = mg en N.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Réaction normale : perpendiculaire au support.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Vérifier la résultante</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Au repos sur l’horizontale : N + P = 0.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Sur le plan sans frottement : composante tangentielle.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La normale n’est généralement pas verticale.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>