<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Équivalence : proportions stœchiométriques</title><desc id="desc">Le changement de réactif limitant permet de relier les quantités introduites ; l’équivalence ne signifie pas pH = 7.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >CDD · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Équivalence : proportions stœchiométriques</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Le changement de réactif limitant permet de relier les quantités introduites ; l’équivalence ne signifie pas pH = 7.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><path d="M115 493L1093 493" stroke="#72858d" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><path d="M115 493L115 206" stroke="#72858d" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="130" y="194" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Quantités normalisées n/a ou n/b</text><path d="M115 254L665 493" stroke="#2863b5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M665 493L1041 493" stroke="#2863b5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M115 493L665 493" stroke="#c75454" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M665 493L1041 288" stroke="#c75454" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M665 216L665 493" stroke="#28776e" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" /><text x="665" y="527" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="middle" font-weight="700" >VE</text><text x="1092" y="529" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="end" font-weight="700" >V titrant</text><text x="355" y="306" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="middle" font-weight="700" >Espèce titrée A restante</text><text x="926" y="265" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#c75454" text-anchor="middle" font-weight="700" >Titrant B en excès</text><text x="372" y="459" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c75454" text-anchor="middle" font-weight="400" >B ajouté aussitôt consommé</text><text x="687" y="231" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="start" font-weight="700" >nA,0/a = nB,versé/b</text><text x="1073" y="555" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#72858d" text-anchor="end" font-weight="400" >Représentation illustrative, réaction totale.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Avant et après VE</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Avant : A en excès, B réactif limitant.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >À VE : A et B introduits dans le rapport a:b.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Après : A épuisé, B en excès.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Repérer expérimentalement VE</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Indicateur dont le virage convient au saut.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >pH-métrie : inflexion, dérivée selon le suivi.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le pH à l’équivalence dépend des couples en jeu.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>