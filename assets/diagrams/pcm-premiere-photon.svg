text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Un atome échange une énergie égale à l’écart entre deux niveaux permis : Ephoton = |E₂ − E₁|.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="77" y="182" width="503" height="365" rx="12" fill="#f6faf7" stroke="#e0e7e1" stroke-width="1.5" /><text x="101" y="219" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >ÉMISSION : E₂ → E₁</text><path d="M124 478L124 252" stroke="#72858d" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="131" y="267" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Énergie</text><path d="M165 296L520 296" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M165 456L520 456" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="504" y="284" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="400" >E₂</text><text x="504" y="489" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="400" >E₁</text><rect x="619" y="182" width="503" height="365" rx="12" fill="#f6faf7" stroke="#e0e7e1" stroke-width="1.5" /><text x="643" y="219" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >ABSORPTION : E₁ → E₂</text><path d="M666 478L666 252" stroke="#72858d" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="673" y="267" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Éne