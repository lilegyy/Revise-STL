<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Dosage par étalonnage : une gamme, une relation</title><desc id="desc">Comparer l’échantillon à des étalons connus mesurés dans les mêmes conditions ; interpoler dans la gamme.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >CDD · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Dosage par étalonnage : une gamme, une relation</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Comparer l’échantillon à des étalons connus mesurés dans les mêmes conditions ; interpoler dans la gamme.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="69" y="183" width="469" height="365" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="87" y="215" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >PRÉPARER ET MESURER LES ÉTALONS</text><path d="M102 279L102 425Q120 444 138 425L138 279" stroke="#72858d" stroke-width="2" fill="#f5fafb" stroke-linejoin="round" stroke-linecap="round" /><rect x="105" y="337" width="30" height="84" rx="0" fill="#346aa1" stroke="none" stroke-width="1.5" fill-opacity="0.12"/><text x="120" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >0</text><path d="M190 279L190 425Q208 444 226 425L226 279" stroke="#72858d" stroke-width="2" fill="#f5fafb" stroke-linejoin="round" stroke-linecap="round" /><rect x="193" y="337" width="30" height="84" rx="0" fill="#346aa1" stroke="none" stroke-width="1.5" fill-opacity="0.26"/><text x="208" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >1</text><path d="M278 279L278 425Q296 444 314 425L314 279" stroke="#72858d" stroke-width="2" fill="#f5fafb" stroke-linejoin="round" stroke-linecap="round" /><rect x="281" y="337" width="30" height="84" rx="0" fill="#346aa1" stroke="none" stroke-width="1.5" fill-opacity="0.4"/><text x="296" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >2</text><path d="M366 279L366 425Q384 444 402 425L402 279" stroke="#72858d" stroke-width="2" fill="#f5fafb" stroke-linejoin="round" stroke-linecap="round" /><rect x="369" y="337" width="30" height="84" rx="0" fill="#346aa1" stroke="none" stroke-width="1.5" fill-opacity="0.54"/><text x="384" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >3</text><path d="M454 279L454 425Q472 444 490 425L490 279" stroke="#72858d" stroke-width="2" fill="#f5fafb" stroke-linejoin="round" stroke-linecap="round" /><rect x="457" y="337" width="30" height="84" rx="0" fill="#346aa1" stroke="none" stroke-width="1.5" fill-opacity="0.68"/><text x="472" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >4</text><text x="304" y="515" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >Blanc → concentrations croissantes</text><path d="M650 489L1081 489" stroke="#72858d" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><path d="M650 489L650 225" stroke="#72858d" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="651" y="205" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >Signal S</text><text x="1063" y="527" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="end" font-weight="700" >Concentration c</text><path d="M673 477L1031 279" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="690" cy="465" r="5" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><circle cx="770" cy="420" r="5" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><circle cx="850" cy="378" r="5" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><circle cx="930" cy="333" r="5" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><circle cx="1010" cy="290" r="5" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><path d="M650 355L889 355" stroke="#c75454" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" /><path d="M889 355L889 489" stroke="#c75454" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" /><circle cx="889" cy="355" r="6" fill="#c75454" stroke="#c75454" stroke-width="2" /><text x="633" y="361" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c75454" text-anchor="end" font-weight="700" >Sx</text><text x="889" y="513" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c75454" text-anchor="middle" font-weight="700" >cx</text><text x="890" y="236" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#28776e" text-anchor="middle" font-weight="700" >S = a c + b</text><text x="884" y="557" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#72858d" text-anchor="middle" font-weight="400" >Points illustratifs : ne pas les utiliser comme mesures.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Garder les mêmes conditions</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Même espèce, matrice, température et réglages.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Gamme préparée avec une verrerie adaptée.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Vérifier le modèle et examiner les écarts des points.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Remonter à la concentration</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >cx = (Sx − b)/a, si le modèle affine est validé.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ne pas forcer b = 0 sans justification.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Si dilution : cmère = F × cx ; éviter l’extrapolation.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>