<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Spectrophotométrie : régler, faire le blanc, mesurer</title><desc id="desc">L’absorbance compare les intensités avant et après traversée de l’échantillon, à longueur d’onde fixée.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >CDD · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Spectrophotométrie : régler, faire le blanc, mesurer</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >L’absorbance compare les intensités avant et après traversée de l’échantillon, à longueur d’onde fixée.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="70" y="181" width="640" height="365" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="88" y="213" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >APPAREIL ET TRAJET OPTIQUE</text><rect x="108" y="251" width="565" height="192" rx="14" fill="#e0e7e9" stroke="#72858d" stroke-width="1.5" /><rect x="140" y="276" width="138" height="55" rx="4" fill="#dce8c6" stroke="#72858d" stroke-width="1.5" /><text x="210" y="312" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#28776e" text-anchor="middle" font-weight="700" >λ choisie</text><circle cx="322" cy="306" r="10" fill="#f6f8f5" stroke="#72858d" stroke-width="2" /><circle cx="360" cy="306" r="10" fill="#f6f8f5" stroke="#72858d" stroke-width="2" /><circle cx="398" cy="306" r="10" fill="#f6f8f5" stroke="#72858d" stroke-width="2" /><rect x="485" y="267" width="135" height="116" rx="4" fill="#f7faf9" stroke="#72858d" stroke-width="1.5" /><rect x="524" y="281" width="47" height="89" rx="2" fill="#acd3e2" stroke="#72858d" stroke-width="1.5" /><path d="M449 326L515 326" stroke="#bb7a18" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><path d="M575 326L643 326" stroke="#bb7a18" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><text x="471" y="303" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#bb7a18" text-anchor="middle" font-weight="700" >I₀</text><text x="618" y="303" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#bb7a18" text-anchor="middle" font-weight="700" >I</text><text x="546" y="414" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="middle" font-weight="700" >Cuve orientée</text><text x="384" y="482" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="middle" font-weight="400" >Source → sélection de λ → cuve → détecteur</text><text x="385" y="520" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#28776e" text-anchor="middle" font-weight="700" >A = log₁₀(I₀/I) = −log₁₀(T)</text><rect x="741" y="181" width="388" height="365" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="759" y="213" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >CUVE : LES BONS GESTES</text><path d="M849 265L921 265L945 285L945 421L873 421L849 401Z" stroke="#72858d" stroke-width="2" fill="url(#glass)" stroke-linejoin="round" stroke-linecap="round" /><path d="M873 285L945 285M873 285L873 421M849 265L873 285" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="875" y="326" width="67" height="91" rx="0" fill="#a6ccdf" stroke="none" stroke-width="1.5" fill-opacity=".65"/><path d="M801 363L857 363" stroke="#bb7a18" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><path d="M953 363L1014 363" stroke="#bb7a18" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><text x="937" y="453" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >Faces optiques propres</text><text x="760" y="492" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="start" font-weight="400" >Tenir par les faces non optiques.</text><text x="760" y="520" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="start" font-weight="400" >Éliminer bulles et traces de doigts.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Préparer le dosage</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Choisir λ près du maximum d’absorption adapté.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Faire le blanc avec la matrice sans l’espèce dosée.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Garder même cuve ou même épaisseur optique.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Respecter le domaine validé</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Solution limpide ; absence de réaction parasite.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Vérifier la linéarité sur la gamme d’étalons.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Diluer si nécessaire ; appliquer le facteur de dilution.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>