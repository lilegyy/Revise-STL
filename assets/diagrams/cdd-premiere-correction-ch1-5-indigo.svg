  <g id="indigo" stroke="#233e36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 170L260 130L190 170L190 250L260 290L330 250Z M320 177L260 143 M201 176V244 M260 277L319 243"/>
    <path d="M330 170L400 150L440 210L409 256 M330 250L383 265 M395 149L409 94 M405 151L419 96"/>
    <path d="M440 205H530 M440 215H530"/>
    <path d="M530 210L558 167 M586 154L640 170L640 250L570 270L530 210 M565 271L551 327 M575 273L561 329"/>
    <path d="M640 170L710 130L780 170L780 250L710 290L640 250 M650 177L710 143 M769 176V244 M710 277L651 243"/>
    <g fill="#233e36" stroke="none" font-family="Arial,sans-serif" font-size="29" text-anchor="middle"><text x="400" y="284">NH</text><text x="418" y="85">O</text><text x="570" y="160">HN</text><text x="553" y="358">O</text></g>
  </g>
</defs>
<rect width="1400" height="1120" rx="28" fill="#fafbf8"/>
<g font-family="Arial,sans-serif" fill="#233e36">
<text x="55" y="60" font-size="36" font-weight="700">Indigo : structure et réaction de synthèse</text>
<text x="55" y="99" font-size="22">Correction · Chapitre 1 · Formule brute C₁₆H₁₀N₂O₂</text>
<rect x="42" y="127" width="1316" height="365" rx="20" fill="#fff" stroke="#cbd8d0"/>
<use href="#indigo" transform="translate(180 100) scale(.92)"/>

<text x="1015" y="193" font-size="22">C=O : carbonyle</text><text x="1020" y="373" font-size="22">NH explicite</text>
<text x="58" y="221" font-size="22">Deux noyaux</text><text x="58" y="247" font-size="22">benzéniques</text>
<text x="700" y="459" font-size="21" text-anchor="middle">Les sommets non nommés sont des C ; leurs H sont implicites. Deux groupes NH, deux groupes C=O.</text>
<rect x="42" y="512" width="1316" height="554" rx="20" fill="#fff" stroke="#cbd8d0"/>
<text x="70" y="552" font-size="27" font-weight="700">Bilan ionique de Baeyer–Drewsen · milieu basique</text>
