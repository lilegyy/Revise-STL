</g>
<text x="120" y="677" font-size="31">2</text><text x="193" y="578" font-size="26">NO₂</text><text x="342" y="653" font-size="26">O</text><text x="300" y="574" font-size="26">H</text>
<text x="450" y="675" font-size="35">+</text><text x="548" y="677" font-size="31">2</text><text x="635" y="586" font-size="26">O</text>
<text x="795" y="675" font-size="35">+</text><text x="930" y="675" font-size="30">2 HO⁻</text>
<text x="242" y="755" font-size="21" text-anchor="middle">2-nitrobenzaldéhyde</text><text x="642" y="755" font-size="21" text-anchor="middle">acétone</text><text x="987" y="755" font-size="21" text-anchor="middle">ions hydroxyde</text>
<path d="M700 778V850" stroke="#2b6856" stroke-width="4" marker-end="url(#arrow)"/><text x="733" y="812" font-size="21" fill="#2b6856">réaction, puis isolement</text>
