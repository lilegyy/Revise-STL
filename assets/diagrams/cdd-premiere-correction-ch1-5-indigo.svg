<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
<title id="title">Indigo : structure et synthèse de Baeyer–Drewsen</title>
<desc id="desc">Deux unités indolinone reliées par une liaison carbone-carbone double trans. Deux molécules de 2-nitrobenzaldéhyde et deux d’acétone réagissent avec deux ions hydroxyde pour donner l’indigo, deux ions acétate et quatre molécules d’eau. Les noyaux benzéniques et liaisons multiples sont explicitement dessinés.</desc>
