<text x="80" y="959" font-size="30">2</text><text x="168" y="891" font-size="25">O</text><text x="217" y="977" font-size="25">O⁻</text>
<text x="380" y="960" font-size="32">+</text><text x="930" y="960" font-size="32">+</text><text x="1055" y="960" font-size="29">4 H₂O</text>
<text x="178" y="1033" font-size="21" text-anchor="middle">ions acétate</text><text x="646" y="1033" font-size="21" text-anchor="middle">indigo · structure identique à celle du haut</text><text x="1104" y="1033" font-size="21" text-anchor="middle">eau</text>
<text x="700" y="1100" font-size="20" text-anchor="middle">Conservation : C₂₀H₂₄N₂O₁₀ et charge −2 de chaque côté. Bilan de réaction, sans détail du mécanisme.</text>
</g></svg>
