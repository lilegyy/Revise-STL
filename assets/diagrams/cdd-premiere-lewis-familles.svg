<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Groupes caractéristiques : lire la structure</title><desc id="desc">Un groupe caractéristique détermine la famille ; R et R′ désignent ici des groupes carbonés.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >CDD · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Groupes caractéristiques : lire la structure</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Un groupe caractéristique détermine la famille ; R et R′ désignent ici des groupes carbonés.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="64" y="181" width="258" height="169" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="82" y="213" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >Alcool</text><text x="193" y="268" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#223d43" text-anchor="middle" font-weight="700" >R–O–H</text><text x="193" y="309" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="middle" font-weight="400" >hydroxyle</text><rect x="342" y="181" width="258" height="169" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="360" y="213" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >Aldéhyde</text><text x="471" y="268" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#223d43" text-anchor="middle" font-weight="700" >R–C(=O)–H</text><text x="471" y="309" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="middle" font-weight="400" >carbonyle terminal</text><rect x="620" y="181" width="258" height="169" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="638" y="213" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >Cétone</text><text x="749" y="268" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#223d43" text-anchor="middle" font-weight="700" >R–C(=O)–R′</text><text x="749" y="309" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="middle" font-weight="400" >carbonyle entre C</text><rect x="898" y="181" width="258" height="169" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="916" y="213" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >Acide carboxylique</text><text x="1027" y="268" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#223d43" text-anchor="middle" font-weight="700" >R–C(=O)–OH</text><text x="1027" y="309" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="middle" font-weight="400" >carboxyle</text><rect x="64" y="367" width="258" height="169" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="82" y="399" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >Ester</text><text x="193" y="454" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#223d43" text-anchor="middle" font-weight="700" >R–C(=O)–O–R′</text><text x="193" y="495" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="middle" font-weight="400" >fonction ester</text><rect x="342" y="367" width="258" height="169" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="360" y="399" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >Amine</text><text x="471" y="454" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#223d43" text-anchor="middle" font-weight="700" >R–NH₂</text><text x="471" y="495" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="middle" font-weight="400" >amine primaire</text><rect x="620" y="367" width="258" height="169" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="638" y="399" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >Amide</text><text x="749" y="454" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#223d43" text-anchor="middle" font-weight="700" >R–C(=O)–NH₂</text><text x="749" y="495" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="middle" font-weight="400" >amide primaire</text><rect x="898" y="367" width="258" height="169" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="916" y="399" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >Alcène</text><text x="1027" y="454" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#223d43" text-anchor="middle" font-weight="700" >R₂C=CR′₂</text><text x="1027" y="495" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="middle" font-weight="400" >liaison C=C</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Compléter une formule de Lewis</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >H forme une liaison ; O en forme souvent deux.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ajouter les doublets non liants et les charges utiles.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Dans les formes usuelles neutres : C a quatre liaisons.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Distinguer formule et famille</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Un groupe –OH dans –COOH n’est pas un alcool.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Une espèce peut posséder plusieurs fonctions.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La position et l’enchaînement des atomes comptent.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>