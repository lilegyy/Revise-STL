<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Sirop de menthe : quelles raies traversent ?</title><desc id="desc">Modèle du sujet : seules les radiations de 420 nm à 560 nm sont transmises.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker></defs><rect width="1200" height="800" fill="#f4f5f0"/><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd"/><rect x="44" y="160" width="1112" height="406" rx="16" fill="#fff" stroke="#e3e8e7"/><text x="48" y="61" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#28776e">PCM · PREMIÈRE · CORRECTION</text><text x="48" y="104" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#223d43">Sirop de menthe : quelles raies traversent ?</text><text x="48" y="139" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#72858d">Modèle du sujet : seules les radiations de 420 nm à 560 nm sont transmises.</text><text x="65" y="250" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#223d43">Lampe Hg</text><text x="65" y="390" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#223d43">Fenêtre du sirop</text><text x="65" y="500" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#223d43">Après le sirop</text><rect x="285" y="215" width="816" height="60" rx="3" fill="#14232b" stroke="none"/><rect x="285" y="465" width="816" height="60" rx="3" fill="#14232b" stroke="none"/><rect x="346.75" y="215" width="4" height="60" rx="3" fill="#8432bf" stroke="none"/><rect x="423.25" y="215" width="4" height="60" rx="3" fill="#285bff" stroke="none"/><rect x="706.3" y="215" width="4" height="60" rx="3" fill="#64df36" stroke="none"/><rect x="785.3499999999999" y="215" width="4" height="60" rx="3" fill="#ffff00" stroke="none"/><rect x="790.45" y="215" width="4" height="60" rx="3" fill="#ebed00" stroke="none"/><rect x="423.25" y="465" width="4" height="60" rx="3" fill="#285bff" stroke="none"/><rect x="706.3" y="465" width="4" height="60" rx="3" fill="#64df36" stroke="none"/><text x="348.75" y="204" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#223d43">405</text><text x="425.25" y="204" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#223d43">435</text><text x="708.3" y="204" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#223d43">546</text><text x="789.9" y="204" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#223d43">577 / 579</text><rect x="285" y="355" width="816" height="54" rx="3" fill="#e6eae5" stroke="none"/><rect x="387.0" y="355" width="357.0" height="54" rx="3" fill="#dceccf" stroke="#28776e"/><text x="397.0" y="390" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#28776e">420–560 nm : transmis</text><path d="M387.0 290L387.0 450" fill="none" stroke="#72858d" stroke-width="1" /><path d="M744.0 290L744.0 450" fill="none" stroke="#72858d" stroke-width="1" /><text x="425.25" y="550" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2863b5">≈435 nm</text><text x="708.3" y="550" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2863b5">≈546 nm</text><rect x="44" y="587" width="550" height="156" rx="3" fill="#f1f6f3" stroke="#d7e2dc"/><text x="64" y="621" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#28776e">Sélectionner, sans créer de radiations</text><text x="64" y="650" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#223d43">405 nm est sous 420 : retirée.</text><text x="64" y="679" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#223d43">435 et 546 nm : conservées.</text><text x="64" y="708" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#223d43">577 / 579 nm sont au-dessus de 560 : retirées.</text><rect x="606" y="587" width="550" height="156" rx="3" fill="#f1f6f3" stroke="#d7e2dc"/><text x="626" y="621" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#28776e">Tracer le résultat</text><text x="626" y="650" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#223d43">Deux raies lumineuses sur fond noir.</text><text x="626" y="679" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#223d43">Même axe λ pour comparer avant / après.</text><text x="626" y="708" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#223d43">Aucun continuum : la lampe émet des raies.</text><text x="48" y="771" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#72858d">Schéma de correction · Valeurs issues du modèle du sujet, pas d’une mesure de laboratoire.</text></svg>