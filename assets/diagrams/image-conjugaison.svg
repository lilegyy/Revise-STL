><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Exemple cohérent : f′ = 10 cm ; objet à 30 cm à gauche ; image à 15 cm à droite.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><path d="M90 340L1100 340" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arr-gray)" /><text x="1080" y="368" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#72858d" text-anchor="end" font-weight="400" >axe optique →</text><path d="M680 225.0Q653 340 680 455.0Q707 340 680 225.0" stroke="#2863b5" stroke-width="2" fill="url(#glass)" stroke-linejoin="round" stroke-linecap="round" /><path d="M680 219.0L680 461.0" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" marker-start="url(#arr-blue)"/><circle cx="680" cy="340" r="3" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><text x="680" y="206.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="middle" font-weight="700" >f′ = +10 cm</text><path d="M230 340L230 250" stroke="#28776e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><path d="M905 340L905 385" stroke="#c75454" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><text x="205" y="372" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="400" >A</text><text x="205" y="240" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >B</text><text x="925" y="372" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c75454" text-anchor="start" font-weight="400" >A′</text><text x="925" y="414" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c75454" text-anchor="start" font-weight="700" >B′</text><circle cx="530" cy="340" r="4" fill="#223d43" stroke="#223d43" stroke-width="2" /><text x="530" y="370" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="middle" font-weight="400" >F</text><circle cx="680" cy="340" r="4" fill="#223d43" stroke="#223d43" stroke-width="2" /><text x="680" y="370" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="middle" font-weight="400" >O</text><circle cx="830" cy="340" r="4" fill="#223d43" stroke="#223d43" stroke-width="2" /><text x="830" y="370" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="middle" font-weight="400" >F′</text><path d="M230 250L680 250L905 385" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M464.0 250.0L500.0 250.0" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M797.0 320.2L815.0 331.0" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M230 250L680 340L905 385" stroke="#bb7a18" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M464.0 296.8L500.0 304.0" stroke="#bb7a18" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><path d="M797.0 363.4L815.0 367.0" stroke="#bb7a18" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><path d="M230 464L230 480" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M680 464L680 480" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M230 472L680 472" stroke="#72858d" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" marker-start="url(#arr-gray)"/><rect x="385.7" y="447" width="138.6" height="25" rx="4" fill="#fff" stroke="none" stroke-width="1.5" /><text x="455.0" y="466" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="700" >OA = −30 cm</text><path d="M680 464L680 480" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M905 464L905 480" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M680 472L905 472" stroke="#72858d" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" marker-start="url(#arr-gray)"/><rect x="717.9" y="447" width="149.2" height="25" rx="4" fill="#fff" stroke="none" stroke-width="1.5" /><text x="792.5" y="466" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="700" >OA′ = +15 cm</text><text x="101" y="201" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#72858d" text-anchor="start" font-weight="400" >Origine : O</text><text x="101" y="229" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#72858d" text-anchor="start" font-weight="400" >Sens positif : vers la droite →</text><rect x="952" y="264" width="172" height="156" rx="10" fill="#f3f6fa" stroke="#d8e2eb" stroke-width="1.5" /><text x="970" y="294" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="start" font-weight="400" >1 / 15 − 1 / (−30)</text><text x="970" y="324" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="start" font-weight="400" >= 1 / 10</text><text x="970" y="354" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="start" font-weight="400" >Distances en cm.</text><text x="970" y="384" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="start" font-weight="400" >γ = −0,50</text><text x="540" y="535" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="middle" font-weight="700" >L’image est deux fois plus petite et renversée.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Relations à employer</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >1 / OA′ − 1 / OA = 1 / f′</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >γ = A′B′ / AB = OA′ / OA</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Toutes les distances portent un signe.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Interpréter les signes</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Objet réel à gauche : OA &lt; 0.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Image réelle à droite : OA′ &gt; 0.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >γ &lt; 0 : renversée ; |γ| &lt; 1 : réduite.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Les couleurs distinguent les trajets ou les éléments, pas toujours la couleur de la lumière.</text></svg>