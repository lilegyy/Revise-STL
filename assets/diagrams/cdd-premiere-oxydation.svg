<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Oxydation ménagée des alcools : suivre les fonctions</title><desc id="desc">Le résultat dépend de la classe de l’alcool et des conditions ; les structures ci-dessous illustrent le bilan organique.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >CDD · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Oxydation ménagée des alcools : suivre les fonctions</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Le résultat dépend de la classe de l’alcool et des conditions ; les structures ci-dessous illustrent le bilan organique.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><text x="83" y="197" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="start" font-weight="700" >ALCOOL PRIMAIRE</text><text x="264" y="240" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#223d43" text-anchor="middle" font-weight="700" >R–CH₂–OH</text><path d="M398 230L513 230" stroke="#2863b5" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="456" y="210" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2863b5" text-anchor="middle" font-weight="700" >[O]</text><text x="687" y="240" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#223d43" text-anchor="middle" font-weight="700" >R–CHO</text><path d="M816 230L918 230" stroke="#2863b5" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="869" y="210" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2863b5" text-anchor="middle" font-weight="700" >[O]</text><text x="1024" y="240" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#223d43" text-anchor="middle" font-weight="700" >R–COOH</text><text x="83" y="336" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="start" font-weight="700" >ALCOOL SECONDAIRE</text><text x="264" y="379" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#223d43" text-anchor="middle" font-weight="700" >R–CH(OH)–R′</text><path d="M398 369L513 369" stroke="#2863b5" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="456" y="349" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2863b5" text-anchor="middle" font-weight="700" >[O]</text><text x="687" y="379" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#223d43" text-anchor="middle" font-weight="700" >R–CO–R′</text><text x="1009" y="379" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="middle" font-weight="700" >Cétone</text><text x="83" y="473" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="start" font-weight="700" >ALCOOL TERTIAIRE</text><text x="264" y="516" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#223d43" text-anchor="middle" font-weight="700" >R₃C–OH</text><text x="770" y="503" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c75454" text-anchor="middle" font-weight="700" >Pas de transformation analogue</text><text x="770" y="537" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c75454" text-anchor="middle" font-weight="400" >sans rupture de la chaîne</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Conditions et identification</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Primaire : aldéhyde puis acide selon les conditions.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Secondaire : cétone dans une oxydation ménagée.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Identifier les produits avec des tests complémentaires.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Ne pas lire [O] comme une équation ajustée</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >[O] résume l’action d’un oxydant dans ce schéma.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Pour un bilan complet : ajuster atomes et charges.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Respecter le protocole et les déchets de l’oxydant utilisé.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>