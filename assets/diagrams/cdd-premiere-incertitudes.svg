bf7" stroke="#72858d" stroke-width="1.2" /><circle cx="646" cy="357" r="66" fill="#f9fbf7" stroke="#72858d" stroke-width="1.2" /><circle cx="646" cy="357" r="33" fill="#f9fbf7" stroke="#72858d" stroke-width="1.2" /><path d="M538 357L754 357" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" /><path d="M646 248L646 466" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" /><circle cx="605" cy="342" r="5" fill="#2863b5" stroke="#2863b5" stroke-width="1" /><circle cx="679" cy="381" r="5" fill="#2863b5" stroke="#2863b5" stroke-width="1" /><circle cx="629" cy="403" r="5" fill="#2863b5" stroke="#2863b5" stroke-width="1" /><circle cx="689" cy="337" r="5" fill="#2863b5" stroke="#2863b5" stroke-width="1" /><circle cx="628" cy="322" r="5" fill="#2863b5" stroke="#2863b5" stroke-width="1" /><circle cx="646" cy="357" r="4" fill="#28776e" stroke="#28776e" stroke-width="2" /><text x="646" y="511" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#72858d" text-anchor="middle" font-weight="400" >Centre = référence ; points = mesures</text><rect x="839" y="183" width="290" height="365" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="857" y="215" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >ANNONCER LE RÉSULTAT</text><text x="983" y="296" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#28776e" text-anchor="middle" font-weight="700" >x ± U</text><text x="862" y="347" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >u : incertitude-type</text><text x="862" y="384" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >U = k × u : élargie</text><text x="862" y="421" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >k et couverture précisés</text><text x="862" y="458" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >selon le modèle utilisé</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Évaluer les contributions</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Type A : estimation par analyse de répétitions.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Type B : notice, résolution, étalon, expérience…</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Corriger un biais connu ; garder l’incertitude résiduelle.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Comparer à une référence</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Prendre en compte l’incertitude des deux valeurs.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Appliquer le critère demandé et ses hypothèses.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Aucun seuil unique ne remplace cette analyse.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>