<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Fidélité, biais et incertitude : trois idées distinctes</title><desc id="desc">Les répétitions décrivent une dispersion ; elles ne suffisent pas à révéler toutes les erreurs systématiques.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >CDD · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Fidélité, biais et 