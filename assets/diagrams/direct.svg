<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Titrage direct et titrage en retour"><title>Titrage direct et titrage en retour</title><g font-family="Arial,sans-serif"><rect x="20" y="45" width="265" height="230" rx="18" fill="#f7e9ee" stroke="#b77891"/><rect x="305" y="45" width="275" height="230" rx="18" fill="#e8f0f9" stroke="#678cc0"/><text x="150" y="82" fill="#a55777" font-size="18" text-anchor="middle">TITRAGE DIRECT</text><text x="150" y="127" fill="#3c4944" font-size="16" text-anchor="middle">Une réaction de titrage</text><text x="150" y="187" fill="#3c4944" font-size="17" text-anchor="middle">A + B (titrant) → produits</text><text x="443" y="82" fill="#3e70b0" font-size="18" text-anchor="middle">TITRAGE EN RETOUR</text><text x="443" y="122" fill="#3c4944" font-size="16" text-anchor="middle">1. A réagit avec B en excès</text><text x="443" y="177" fill="#3c4944" font-size="16" text-anchor="middle">2. On titre B restant avec E</text><text x="443" y="226" fill="#3c4944" font-size="16" text-anchor="middle">B restant + E → produits</text></g></svg>