<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Lois de Newton : résultante et accélération</title><desc id="desc">Dans un référentiel galiléen, la résultante des forces modifie le vecteur vitesse.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >PCM · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Lois de Newton : résultante et accélération</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Dans un référentiel galiléen, la résultante des forces modifie le vecteur vitesse.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="73" y="181" width="513" height="365" rx="12" fill="#f7faf8" stroke="#e0e7e2" stroke-width="1.5" /><text x="95" y="217" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >FORCES QUI SE COMPENSENT</text><rect x="613" y="181" width="513" height="365" rx="12" fill="#f7faf8" stroke="#e0e7e2" stroke-width="1.5" /><text x="635" y="217" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >RÉSULTANTE NON NULLE</text><rect x="264" y="352" width="114" height="51" rx="8" fill="#b4ccd3" stroke="#72858d" stroke-width="1.5" /><circle cx="288" cy="407" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="354" cy="407" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="321" cy="383" r="4" fill="#223d43" stroke="#223d43" stroke-width="2" /><path d="M100 422L549 422" stroke="#72858d" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M321 383L321 281" stroke="#28776e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><path d="M321 383L321 485" stroke="#c75454" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><path d="M239 261L407 261" stroke="#2863b5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="324" y="243" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2863b5" text-anchor="middle" font-weight="700" >v constant</text><text x="320" y="528" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="middle" font-weight="700" >ΣF = 0  ⇔  a = 0</text><rect x="799" y="352" width="114" height="51" rx="8" fill="#b4ccd3" stroke="#72858d" stroke-width="1.5" /><circle cx="823" cy="407" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="889" cy="407" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="856" cy="383" r="4" fill="#223d43" stroke="#223d43" stroke-width="2" /><path d="M646 422L1098 422" stroke="#72858d" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M856 383L856 281" stroke="#28776e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><path d="M856 383L856 485" stroke="#c75454" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><path d="M856 383L1030 383" stroke="#bb7a18" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><text x="1002" y="355" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#bb7a18" text-anchor="start" font-weight="700" >F</text><path d="M738 262L945 262" stroke="#2863b5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="984" y="269" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#2863b5" text-anchor="start" font-weight="700" >a</text><text x="856" y="528" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#28776e" text-anchor="middle" font-weight="700" >ΣF = m × a</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Première loi : le principe d’inertie</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Forces compensées → repos ou rectiligne uniforme.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >L’absence d’accélération n’exige pas une vitesse nulle.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Un mouvement circulaire uniforme a une accélération.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Deuxième loi : relation vectorielle</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >ΣF = m a : projeter sur les axes du repère.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >m en kg ; F en N ; a en m·s⁻².</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Exemple calculé : 10 N / 2 kg = 5 m·s⁻².</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>