ly="Arial, Helvetica, sans-serif" font-size="22" fill="#28776e" text-anchor="middle" font-weight="700" >Δℓ = ℓ − ℓ₀</text><rect x="806" y="232" width="296" height="291" rx="12" fill="#f0f6f2" stroke="#dbe5de" stroke-width="1.5" /><text x="830" y="268" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >LOI DE HOOKE</text><path d="M837 483L837 307" stroke="#72858d" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><path d="M837 483L1082 483" stroke="#72858d" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><path d="M839 481L1054 325" stroke="#2863b5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="854" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="start" font-weight="400" >F (N)</text><text x="1056" y="510" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="end" font-weight="400" >Δℓ (m)</text><text x="966" y="408" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2863b5" text-anchor="middle" font-weight="700" >F = k Δℓ</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Mesurer l’allongement</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Mesurer ℓ₀ puis ℓ à l’équilibre, sur la même origine.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Δℓ = ℓ − ℓ₀ ; utiliser des mètres dans F = k Δℓ.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Éviter oscillations et dépassement du domaine élastique.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Déterminer la raideur</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >À l’équilibre : F = P = m × g.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La pente de F(Δℓ) donne k en N·m⁻¹.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Un ressort raide s’allonge moins pour la même force.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>