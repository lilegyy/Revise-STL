oke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M494 346L494 212" stroke="#2863b5" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M517 363L517 244" stroke="#c75454" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><path d="M535 251L535 362" stroke="#28776e" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><path d="M420 428L420 520Q420 528 430 528L607 528Q617 528 617 520L617 428" stroke="#72858d" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="423" y="455.0" width="191" height="70.0" rx="0" fill="#d3e9ee" stroke="none" stroke-width="1.5" fill-opacity=".7"/><path d="M423 455.0L614 455.0" stroke="#2863b5" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M599 444.6666666666667L613 444.6666666666667" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M599 461.3333333333333L613 461.3333333333333" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M599 478.0L613 478.0" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M599 494.6666666666667L613 494.6666666666667" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="417" y="526" width="204" height="28" rx="5" fill="#b8cad2" stroke="#72858d" stroke-width="1.5" /><circle cx="594" cy="541" r="7" fill="#f4f8f8" stroke="#72858d" stroke-width="2" /><path d="M507 374L507 406L448 497Q448 507 460 508H580Q591 507 590 497L533 406L533 374Z" stroke="#72858d" stroke-width="2.6" fill="#fbfcf8" stroke-linejoin="round" stroke-linecap="round" /><path d="M464 475H576L585 496Q580 504 570 504H471Q458 504 455 496Z" stroke="none" stroke-width="0" fill="#e6d594" stroke-linejoin="round" stroke-linecap="round" /><rect x="500" y="493" width="35" height="7" rx="3" fill="#f4faf7" stroke="#72858d" stroke-width="1.5" /><text x="889" y="407" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >Erlenmeyer rodé : 100 mL</text><text x="867" y="463" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Barreau aimanté</text><path d="M867 469L520 496" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="520" cy="496" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="881" y="195" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Réfrigérant ouvert à l’air</text><path d="M881 201L527 174" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="527" cy="174" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="884" y="249" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Sortie d’eau (haut)</text><path d="M884 255L580 200" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="580" cy="200" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="884" y="340" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Entrée d’eau froide (bas)</text><path d="M884 346L457 363" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="457" cy="363" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="166" y="221" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Potence + pinces</text><path d="M166 227L281 247" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="281" cy="247" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="841" y="536" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Bain chauffé / agitation</text><path d="M841 542L615 541" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="615" cy="541" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="716" y="286" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c75454" text-anchor="start" font-weight="700" >Vapeurs ↑</text><text x="1013" y="286" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="end" font-weight="700" >Condensat ↓</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Principe du reflux</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Chauffer le mélange ; les vapeurs montent.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >L’eau du réfrigérant condense les vapeurs.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le liquide retourne dans le même récipient.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Régler et arrêter le montage</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Démarrer l’eau par le bas, sortie en haut.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Maintenir un reflux modéré et le montage ouvert.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Respecter le sujet et la hotte ; laisser refroidir avant démontage.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>