<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">ECE : doser un colorant avec une photographie</title><desc id="desc">Montage fixe : fond rouge → cuve → objectif du téléphone ; blanc et étalons photographiés dans les mêmes conditions.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >SPCL · PREMIÈRE · IMAGE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >ECE : doser un colorant avec une photographie</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Montage fixe : fond rouge → cuve → objectif du téléphone ; blanc et étalons photographiés dans les mêmes conditions.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><path d="M86 472L1120 472" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="96" y="237" width="40" height="208" rx="6" fill="#d15b5b" stroke="#c75454" stroke-width="1.5" /><rect x="104" y="245" width="23" height="193" rx="3" fill="#ef8585" stroke="none" stroke-width="1.5" /><path d="M160 443L160 231L662 231L662 443" stroke="#72858d" stroke-width="5" fill="#eef0ee" stroke-linejoin="round" stroke-linecap="round" /><rect x="177" y="247" width="468" height="183" rx="0" fill="#f6f6f2" stroke="none" stroke-width="1.5" /><path d="M176 430L647 430" stroke="#454f4c" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M136 280L613 300L613 400L136 411Z" stroke="none" stroke-width="0" fill="#d97d7d" stroke-linejoin="round" stroke-linecap="round" opacity=".16"/><rect x="389" y="272" width="78" height="160" rx="5" fill="#d9ecf2" stroke="#2863b5" stroke-width="2.2" fill-opacity=".5"/><rect x="397" y="300" width="62" height="123" rx="2" fill="#5bbfce" stroke="none" stroke-width="1.5" fill-opacity=".7"/><path d="M397 301Q426 305 459 301" stroke="#2863b5" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="375" y="432" width="107" height="16" rx="3" fill="#7d949d" stroke="#72858d" stroke-width="1.5" /><rect x="594" y="284" width="35" height="134" rx="7" fill="#314650" stroke="#223d43" stroke-width="1.5" /><circle cx="612" cy="308" r="10" fill="#8ba8b4" stroke="#223d43" stroke-width="2" /><circle cx="612" cy="308" r="4" fill="#22323b" stroke="none" stroke-width="2" /><path d="M611 418L611 456" stroke="#72858d" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="565" y="456" width="96" height="15" rx="5" fill="#a6b8bf" stroke="#72858d" stroke-width="1.5" /><path d="M140 310L389 310" stroke="#c75454" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M269.48 310.0L289.4 310.0" stroke="#c75454" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><path d="M467 310L600 310" stroke="#c75454" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M536.16 310.0L546.8 310.0" stroke="#c75454" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><text x="108" y="204" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="700" >Fond rouge</text><path d="M108 210L112 262" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="112" cy="262" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="406" y="196" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Boîte : lumière parasite limitée</text><path d="M406 202L270 235" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="270" cy="235" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="499" y="224" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Cuve : même orientation</text><path d="M499 230L438 280" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="438" cy="280" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="714" y="204" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Téléphone immobilisé</text><path d="M714 210L617 323" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="617" cy="323" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><rect x="773" y="248" width="335" height="226" rx="10" fill="#f3f7f5" stroke="#dde6df" stroke-width="1.5" /><text x="793" y="281" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="start" font-weight="700" >PIXEL DANS LA SOLUTION</text><rect x="809" y="303" width="118" height="95" rx="4" fill="#63b0bd" stroke="#72858d" stroke-width="1.5" /><path d="M819 303L819 398" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M831 303L831 398" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M843 303L843 398" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M855 303L855 398" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M867 303L867 398" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M879 303L879 398" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M891 303L891 398" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M903 303L903 398" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M915 303L915 398" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M809 307L927 307" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M809 319L927 319" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M809 331L927 331" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M809 343L927 343" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M809 355L927 355" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M809 367L927 367" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M809 379L927 379" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M809 391L927 391" stroke="#abd0d4" stroke-width="0.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="845" y="339" width="13" height="13" rx="0" fill="#b74c26" stroke="#c75454" stroke-width="2" /><path d="M858 346L959 346" stroke="#72858d" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="979" y="331" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="middle" font-weight="400" >Même zone</text><text x="979" y="358" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223d43" text-anchor="middle" font-weight="400" >sur chaque photo</text><text x="803" y="435" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >R₀ : eau ; R : solution</text><text x="111" y="532" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Blanc (eau) → étalons → solution inconnue : géométrie inchangée.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Obtenir des photos comparables</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Fixer distance, fond et zone de lecture des pixels.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Verrouiller exposition, ISO et balance des blancs.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Éviter reflets, bulles, saturation et cuve déplacée.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Exploiter l’étalonnage du sujet</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >A = log₁₀(R₀ / R) ; relever R dans la même zone.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Tracer A = a × c + b, puis c = (A − b) / a.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Méthode approchée avec JPEG : suivre les consignes.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Les couleurs distinguent les trajets ou les éléments, pas toujours la couleur de la lumière.</text></svg>