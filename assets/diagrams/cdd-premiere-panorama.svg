<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">La chimie : besoins, ressources et procédés</title><desc id="desc">Une même molécule possède les mêmes propriétés, qu’elle soit extraite ou obtenue par synthèse.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >CDD · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >La chimie : besoins, ressources et procédés</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Une même molécule possède les mêmes propriétés, qu’elle soit extraite ou obtenue par synthèse.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="70" y="203" width="316" height="258" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="88" y="235" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >RESSOURCES</text><text x="94" y="281" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >Minérales : minerais, eau…</text><text x="94" y="330" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >Fossiles : pétrole, gaz…</text><text x="94" y="379" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >Biomasse : végétaux…</text><rect x="442" y="203" width="316" height="258" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="460" y="235" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >TRANSFORMATIONS</text><text x="466" y="281" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >Extraction et séparation</text><text x="466" y="330" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >Synthèse chimique</text><text x="466" y="379" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >Biotechnologies</text><rect x="814" y="203" width="316" height="258" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="832" y="235" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >USAGES</text><text x="838" y="281" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >Santé et hygiène</text><text x="838" y="330" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >Matériaux et énergie</text><text x="838" y="379" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >Agriculture et alimentation</text><path d="M389 331L431 331" stroke="#28776e" stroke-width="2.7" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><path d="M761 331L803 331" stroke="#28776e" stroke-width="2.7" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><path d="M969 476Q969 537 602 537Q233 537 233 479" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)"/><text x="605" y="520" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2863b5" text-anchor="middle" font-weight="700" >Réemploi, recyclage et valorisation selon le produit</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Définir sans confondre</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Espèce naturelle : présente dans la nature.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Espèce de synthèse : obtenue par transformation.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >« Naturel » ne signifie pas automatiquement sûr.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Évaluer un procédé</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Qualité du produit et service réellement rendu.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Dangers, ressources, énergie et déchets.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Prendre en compte les étapes de tout le cycle de vie.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>