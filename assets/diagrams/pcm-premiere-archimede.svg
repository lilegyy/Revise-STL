7L926 444.6666666666667" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M912 466.0L926 466.0" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M912 487.3333333333333L926 487.3333333333333" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M312 408L312 444" stroke="#72858d" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="286" y="443" width="52" height="51" rx="4" fill="#aebfc7" stroke="#72858d" stroke-width="1.5" /><circle cx="312" cy="467" r="3" fill="#223d43" stroke="#223d43" stroke-width="2" /><path d="M811 408L811 444" stroke="#72858d" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="785" y="443" width="52" height="51" rx="4" fill="#aebfc7" stroke="#72858d" stroke-width="1.5" /><circle cx="811" cy="467" r="3" fill="#223d43" stroke="#223d43" stroke-width="2" /><path d="M312 468L312 538" stroke="#c75454" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><path d="M312 468L312 398" stroke="#28776e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><text x="338" y="530" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#c75454" text-anchor="start" font-weight="700" >P</text><text x="338" y="410" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Rair</text><path d="M811 469L811 538" stroke="#c75454" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><path d="M847 469L847 425" stroke="#2863b5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M778 469L778 444" stroke="#28776e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><text x="837" y="546" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c75454" text-anchor="start" font-weight="700" >P</text><text x="869" y="430" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >FA</text><text x="764" y="442" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="end" font-weight="700" >R</text><text x="312" y="202" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#28776e" text-anchor="middle" font-weight="700" >Dans l’air : Rair ≈ P</text><text x="811" y="202" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#2863b5" text-anchor="middle" font-weight="700" >Dans le liquide : R = P − FA</text><text x="1008" y="369" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223d43" text-anchor="middle" font-weight="700" >Objet loin du fond et des parois</text><path d="M1008 375L837 477" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="837" cy="477" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Mesurer le poids apparent</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Noter la lecture dans l’air puis en immersion complète.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Attendre l’équilibre ; garder l’objet entièrement immergé.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le fil doit rester vertical ; éviter les bulles adhérentes.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Écrire le bilan des forces</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >À l’équilibre : R + FA − P = 0 en valeurs algébriques.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >FA = ρliquide × Vimmergé × g ; R = P − FA.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Les flèches sont décalées pour garder les trois forces lisibles.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>