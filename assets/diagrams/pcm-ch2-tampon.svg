<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img"><rect width="100%" height="100%" rx="18" fill="#fffefa"/><g font-family="Arial,sans-serif" fill="#243f35"><text x="450" y="40" font-size="25" text-anchor="middle">Un tampon consomme les petits ajouts</text><rect x="310" y="100" width="280" height="105" rx="14" fill="#e8eedb" stroke="#8ea391"/><text x="450" y="143" font-size="26" text-anchor="middle">Mélange AH / A⁻</text><text x="450" y="179" font-size="21" text-anchor="middle">pH proche du pKa</text><path d="M450 205L230 270" fill="none" stroke="#345e4e" stroke-width="3"/><path d="M450 205L670 270" fill="none" stroke="#345e4e" stroke-width="3"/><rect x="40" y="280" width="380" height="140" rx="14" fill="#d6e5ee" stroke="#8ea391"/><rect x="480" y="280" width="380" height="140" rx="14" fill="#e4eacb" stroke="#8ea391"/><text x="230" y="321" font-size="21" text-anchor="middle">Petit ajout d’acide H₃O⁺</text><text x="230" y="363" font-size="21" text-anchor="middle">A⁻ + H₃O⁺ → AH + H₂O</text><text x="230" y="396" font-size="17" text-anchor="middle">La base du tampon est consommée</text><text x="670" y="321" font-size="21" text-anchor="middle">Petit ajout de base HO⁻</text><text x="670" y="363" font-size="21" text-anchor="middle">AH + HO⁻ → A⁻ + H₂O</text><text x="670" y="396" font-size="17" text-anchor="middle">L’acide du tampon est consommé</text><text x="450" y="467" font-size="19" text-anchor="middle">La réserve est limitée : il faut encore les deux formes après l’ajout.</text></g></svg>