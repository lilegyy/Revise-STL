" cy="267" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="859" y="208" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="700" >Cristallin</text><path d="M859 214L752 278" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="752" cy="278" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="1089" y="237" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="end" font-weight="700" >Rétine</text><path d="M1089 243L994 299" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="994" cy="299" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><circle cx="995" cy="352.5" r="4" fill="#c75454" stroke="#c75454" stroke-width="2" /><text x="1040" y="474" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="end" font-weight="700" >Image sur la rétine</text><path d="M1040 480L995 352.5" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="995" cy="352.5" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="772" y="372" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >O</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Calculer l’accommodation</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >OA = −15,0 cm ; OA′ = +2,50 cm.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >1 / f′ = 1 / 2,50 − 1 / (−15,0).</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >f′ = 2,14 cm = 0,0214 m ; C = 1 / f′.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Ce qui change pour voir de près</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La rétine reste en place.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le cristallin devient plus bombé : C augmente.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Sans accommodation, l’image serait derrière.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Les couleurs distinguent les trajets ou les éléments, pas toujours la couleur de la lumière.</text></svg>