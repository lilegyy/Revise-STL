<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Deux synthèses des couleurs : addition ou soustraction</title><desc id="desc">Des faisceaux se superposent ; des filtres successifs retirent des composantes spectrales.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >SPCL · PREMIÈRE · IMAGE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Deux synthèses des couleurs : addition ou soustraction</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Des faisceaux se superposent ; des filtres successifs retirent des composantes spectrales.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="67" y="180" width="516" height="365" rx="12" fill="#162630" stroke="none" stroke-width="1.5" /><rect x="610" y="180" width="522" height="365" rx="12" fill="#f7faf8" stroke="#dee5df" stroke-width="1.5" /><text x="91" y="215" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#fff" text-anchor="start" font-weight="700" >SYNTHÈSE ADDITIVE</text><text x="636" y="215" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#28776e" text-anchor="start" font-weight="700" >SYNTHÈSE SOUSTRACTIVE</text><g style="isolation:isolate"><circle cx="266" cy="328" r="103" fill="#ff0000" stroke="none" stroke-width="2" style="mix-blend-mode:screen"/><circle cx="387" cy="328" r="103" fill="#00ff00" stroke="none" stroke-width="2" style="mix-blend-mode:screen"/><circle cx="327" cy="421" r="103" fill="#0000ff" stroke="none" stroke-width="2" style="mix-blend-mode:screen"/></g><text x="229" y="313" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="700" >R</text><text x="425" y="313" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#12212c" text-anchor="middle" font-weight="700" >V</text><text x="327" y="468" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="700" >B</text><text x="327" y="288" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#12212c" text-anchor="middle" font-weight="700" >J</text><text x="265" y="397" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#12212c" text-anchor="middle" font-weight="700" >M</text><text x="388" y="397" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#12212c" text-anchor="middle" font-weight="700" >C</text><text x="327" y="357" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#12212c" text-anchor="middle" font-weight="700" >blanc</text><g style="isolation:isolate"><circle cx="810" cy="328" r="103" fill="#00ffff" stroke="none" stroke-width="2" style="mix-blend-mode:multiply"/><circle cx="931" cy="328" r="103" fill="#ff00ff" stroke="none" stroke-width="2" style="mix-blend-mode:multiply"/><circle cx="871" cy="421" r="103" fill="#ffff00" stroke="none" stroke-width="2" style="mix-blend-mode:multiply"/></g><text x="773" y="313" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#223d43" text-anchor="middle" font-weight="700" >C</text><text x="969" y="313" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#223d43" text-anchor="middle" font-weight="700" >M</text><text x="871" y="468" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#223d43" text-anchor="middle" font-weight="700" >J</text><text x="871" y="288" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="700" >B</text><text x="809" y="397" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#223d43" text-anchor="middle" font-weight="700" >V</text><text x="932" y="397" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="700" >R</text><text x="871" y="357" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" >noir</text><text x="93" y="533" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#fff" text-anchor="start" font-weight="700" >R + V + B → blanc</text><text x="636" y="533" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >C puis M puis J → noir idéal</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Additionner des lumières</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >R + V = jaune ; V + B = cyan ; R + B = magenta.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Les trois lumières atteignent la même zone.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Les sous-pixels RVB d’un écran utilisent ce principe.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Retirer des composantes</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >C absorbe R ; M absorbe V ; J absorbe B.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La lumière finale est commune aux transmissions.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Avec des filtres réels : résultat parfois imparfait.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Les couleurs distinguent les trajets ou les éléments, pas toujours la couleur de la lumière.</text></svg>