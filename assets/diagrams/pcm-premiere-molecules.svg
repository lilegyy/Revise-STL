63b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Passer à la géométrie</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >AXnEm : X = atomes liés ; E = doublets non liants.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Les domaines électroniques se placent loin les uns des autres.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Un doublet non liant influence aussi la forme de l’édifice.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>