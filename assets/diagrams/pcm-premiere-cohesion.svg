<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Polarité et cohésion de la matière</title><desc id="desc">Distinguer les liaisons covalentes dans une molécule et les interactions entre molécules.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >PCM · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Polarité et cohésion de la matière</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Distinguer les liaisons covalentes dans une molécule et les interactions entre molécules.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="74" y="184" width="506" height="352" rx="12" fill="#f7faf8" stroke="#e1e7e3" stroke-width="1.5" /><rect x="609" y="184" width="522" height="352" rx="12" fill="#f7faf8" stroke="#e1e7e3" stroke-width="1.5" /><text x="95" y="219" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >EAU : MOLÉCULE POLAIRE</text><path d="M216 318L152 392" stroke="#72858d" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="152" cy="392" r="17" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="152" y="399" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="700" >H</text><path d="M216 318L280 392" stroke="#72858d" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="280" cy="392" r="17" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="280" y="399" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="700" >H</text><circle cx="216" cy="318" r="22" fill="#c75454" stroke="#c75454" stroke-width="2" /><text x="216" y="325" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="700" >O</text><path d="M451 393L515 318" stroke="#72858d" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="515" cy="318" r="17" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="515" y="325" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="700" >H</text><path d="M451 393L532 431" stroke="#72858d" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="532" cy="431" r="17" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="532" y="438" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="700" >H</text><circle cx="451" cy="393" r="22" fill="#c75454" stroke="#c75454" stroke-width="2" /><text x="451" y="400" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="700" >O</text><text x="207" y="281" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c75454" text-anchor="start" font-weight="400" >δ−</text><text x="140" y="435" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2863b5" text-anchor="start" font-weight="400" >δ+</text><text x="269" y="435" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2863b5" text-anchor="start" font-weight="400" >δ+</text><path d="M300 392L425 393" stroke="#28776e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" /><text x="357" y="366" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="middle" font-weight="700" >O–H ··· O</text><text x="326" y="498" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >··· : liaison hydrogène entre molécules</text><text x="630" y="219" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#28776e" text-anchor="start" font-weight="700" >CO₂ : LIAISONS POLARISÉES, MOLÉCULE APOLAIRE</text><path d="M722 326L842 326" stroke="#72858d" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M898 326L1018 326" stroke="#72858d" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="700" cy="326" r="23" fill="#c75454" stroke="#c75454" stroke-width="2" /><text x="700" y="333" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="700" >O</text><circle cx="870" cy="326" r="23" fill="#223d43" stroke="#223d43" stroke-width="2" /><text x="870" y="333" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="700" >C</text><circle cx="1040" cy="326" r="23" fill="#c75454" stroke="#c75454" stroke-width="2" /><text x="1040" y="333" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="700" >O</text><path d="M803 288L726 288" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M937 288L1014 288" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="700" y="257" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c75454" text-anchor="middle" font-weight="400" >δ−</text><text x="870" y="257" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2863b5" text-anchor="middle" font-weight="400" >δ+</text><text x="1040" y="257" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c75454" text-anchor="middle" font-weight="400" >δ−</text><text x="637" y="402" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >La symétrie compense la polarisation des liaisons.</text><text x="637" y="442" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >La molécule est apolaire malgré ses liaisons C=O.</text><text x="637" y="482" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#223d43" text-anchor="start" font-weight="400" >Les interactions de Van der Waals subsistent.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Reconnaître une liaison hydrogène</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >H lié à N, O ou F ; partenaire porteur d’un doublet.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Une liaison covalente O–H n’est pas une liaison H.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le trait pointillé relie deux sites appropriés.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Interpréter un changement d’état</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La structure des molécules reste généralement intacte.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Les interactions entre molécules sont modifiées.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Des interactions plus fortes demandent plus d’énergie.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>