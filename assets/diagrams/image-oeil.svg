ne</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Modèle réduit : diaphragme = iris/pupille ; lentille = cornée + cristallin ; écran = rétine.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><defs><clipPath id="eye"><path d="M600 346C655 196 907 178 1060 343C917 518 650 511 600 346Z"/></clipPath></defs><path d="M600 346C655 196 907 178 1060 343C917 518 650 511 600 346Z" stroke="#72858d" stroke-width="3" fill="#eff5f1" stroke-linejoin="round" stroke-linecap="round" /><path d="M987 253Q1003 346 987 438" stroke="#c75454" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M603 294Q558 345 603 397" stroke="#2863b5" stroke-width="3" fill="#dbf0f8" stroke-linejoin="round" stroke-linecap="round" /><path d="M685 247L685 285" stroke="#28776e" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M685 405L685 443" stroke="#28776e" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M745 254.0Q718 345 745 436.0Q772 345 745 254.0" stroke="#2863b5" stroke-width="2" fill="url(#glass)" stroke-linejoin="round" stroke-linecap="round" /><path d="M745 248.0L745 442.0" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" marker-start="url(#arr-blue)"/><circle cx="745" cy="345" r="3" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><path d="M95 345L1110 345" stroke="#72858d" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" /><path d="M105 300L745 300L995 345" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M437.8 300.0L489.0 300.0" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M875.0 323.4L895.0 327.0" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M105 345L745 345L995 345" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M437.8 345.0L489.0 345.0" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M875.0 345.0L895.0 345.0" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M105 390L745 390L995 345" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M437.8 390.0L489.0 390.0" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M875.0 366.6L895.0 363.0" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="109" y="202" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >Objet lointain sur l’axe</text><text x="109" y="461" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2863b5" text-anchor="start" font-weight="700" >Rayons incidents quasi parallèles</text><path d="M745 512L745 528" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M995 512L995 528" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M745 520L995 520" stroke="#72858d" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" marker-start="url(#arr-gray)"/><rect x="705.3" y="495" width="329.4" height="25" rx="4" fill="#fff" stroke="none" stroke-width="1.5" /><text x="870.0" y="514" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="700" >distance lentille–rétine fixe</text><text x="575" y="216" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="end" font-weight="700" >Cornée</text><path d="M575 222L595 301" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="595" cy="301" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="730" y="206" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="end" font-weight="700" >Iris / pupille</text><path d="M730 212L685 267" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="685" cy="267" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="859" y="208" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="700" >Cristallin</text><path d="M859 214L752 278" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="752" cy="278" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="1089" y="237" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="end" font-weight="700" >Rétine</text><path d="M1089 243L994 299" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="994" cy="299" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><circle cx="995" cy="345" r="4" fill="#c75454" stroke="#c75454" stroke-width="2" /><text x="1040" y="474" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="end" font-weight="700" >Image sur la rétine</text><path d="M1040 480L995 345" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="995" cy="345" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="772" y="372" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >O</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Le modèle réduit de l’œil</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le cristallin et la cornée font converger la lumière.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La pupille règle la quantité de lumière entrante.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La rétine reçoit une image réelle et renversée.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Accommoder pour voir de près</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La distance lentille–rétine reste presque fixe.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La vergence augmente pour un objet proche.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La netteté exige que l’image se forme sur la rétine.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Les couleurs distinguent les trajets ou les éléments, pas toujours la couleur de la lumière.</text></svg>