<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Comparer le quotient de réaction au produit de solubilité"><title>Comparer le quotient de réaction au produit de solubilité</title><g font-family="Arial,sans-serif"><rect x="35" y="65" width="245" height="100" rx="16" fill="#e2f2e7"/><rect x="320" y="65" width="245" height="100" rx="16" fill="#fbe7e2"/><text x="156" y="103" fill="#276a4a" font-size="23" text-anchor="middle">Qr &lt; Ks</text><text x="156" y="138" fill="#276a4a" font-size="17" text-anchor="middle">Dissolution possible</text><text x="441" y="103" fill="#ab5145" font-size="23" text-anchor="middle">Qr &gt; Ks</text><text x="441" y="138" fill="#ab5145" font-size="17" text-anchor="middle">Précipitation favorisée</text><path d="M45 209L555 209" fill="none" stroke="#45564f" stroke-width="2" /><circle cx="300" cy="209" r="7" fill="#8570ae"/><text x="300" y="244" fill="#746098" font-size="18" text-anchor="middle">Qr = Ks : équilibre de saturation</text><text x="554" y="194" fill="#45564f" font-size="16" text-anchor="end">Qr</text></g></svg>