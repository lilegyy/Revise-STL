<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Réflexion et réfraction : mesurer les bons angles</title><desc id="desc">Vue de profil d’un dioptre plan ; les angles sont mesurés par rapport à la normale.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >SPCL · PREMIÈRE · IMAGE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Réflexion et réfraction : mesurer les bons angles</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Vue de profil d’un dioptre plan ; les angles sont mesurés par rapport à la normale.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="62" y="327" width="1076" height="222" rx="10" fill="#edf6fa" stroke="none" stroke-width="1.5" /><path d="M80 325L1120 325" stroke="#72858d" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M600 175L600 530" stroke="#72858d" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" /><text x="82" y="203" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#223d43" text-anchor="start" font-weight="700" >Air : n₁ = 1,00</text><text x="82" y="513" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#223d43" text-anchor="start" font-weight="700" >Verre : n₂ = 1,50</text><path d="M427.1957290738395 180L600 325L706.9196131017894 505" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M517.0539499554429 255.4L530.8782916295359 267.0" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M655.5981988129305 418.6L664.1517678610736 433.0" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M600 325L772.8042709261605 180" stroke="#c75454" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M689.8582208816034 249.6L703.6825625556963 238.0" stroke="#c75454" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><circle cx="600" cy="325" r="5" fill="#223d43" stroke="#223d43" stroke-width="2" /><path d="M600 259A66 66 0 0 0 549.44 282.58" stroke="#2863b5" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M600 386A61 61 0 0 0 631.15 377.45" stroke="#2863b5" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M600 271A54 54 0 0 1 641.37 290.29" stroke="#c75454" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="551" y="245" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="end" font-weight="700" >i = 50°</text><text x="623" y="418" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="start" font-weight="700" >r ≈ 30,7°</text><text x="646" y="239" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c75454" text-anchor="start" font-weight="700" >i′ = i</text><text x="278" y="206" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="700" >Rayon incident</text><path d="M278 212L456 218" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="456" cy="218" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="829" y="208" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="700" >Rayon réfléchi</text><path d="M829 214L731 216" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="731" cy="216" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="814" y="453" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="700" >Rayon réfracté</text><path d="M814 459L685 468" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="685" cy="468" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="615" y="184" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#72858d" text-anchor="start" font-weight="400" >Normale</text><text x="1085" y="317" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#72858d" text-anchor="end" font-weight="400" >Surface de séparation</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Lois de Snell-Descartes</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Réflexion : i′ = i.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Réfraction : n₁ sin(i) = n₂ sin(r).</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Les rayons et la normale sont dans un même plan.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Contrôler le résultat</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Vers un milieu plus réfringent : r &lt; i.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ici : sin(r) = sin(50°) / 1,50.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le rayon se rapproche de la normale.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Les couleurs distinguent les trajets ou les éléments, pas toujours la couleur de la lumière.</text></svg>