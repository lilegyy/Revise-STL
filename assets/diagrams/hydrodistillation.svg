32" r="3" class="bubble" /><circle cx="258" cy="428" r="3.4" class="bubble" /><circle cx="206" cy="424" r="2.4" class="bubble" /><circle cx="270" cy="440" r="2.6" class="bubble" /><rect x="160" y="450" width="150" height="52" rx="12" class="mantle" /><line x1="172" y1="466" x2="298" y2="466" class="ax thin" style="stroke:var(--ink-3);stroke-width:1"/><line x1="172" y1="480" x2="298" y2="480" class="ax thin" style="stroke:var(--ink-3);stroke-width:1"/><path d="M160 470 Q116 470 116 500 Q116 532 84 542" class="wire" /><path d="M235 300 V246" class="tube-o" style="stroke-width:27"/><path d="M235 300 V246" class="tube-i" style="stroke-width:23"/><path d="M235 240 H316" class="tube-o" style="stroke-width:15"/><path d="M235 240 H316" class="tube-i" style="stroke-width:11"/><rect x="228" y="232" width="14" height="10" rx="3" class="rubber" /><rect x="232" y="150" width="6" height="112" rx="2" class="glass" /><rect x="233.5" y="238" width="3" height="24" rx="0" class="f-red" /><circle cx="235" cy="264" r="4.6" class="f-red" /><rect x="232" y="150" width="6" height="112" rx="2" class="nf" style="stroke:var(--ink-2);stroke-width:1.6"/><line x1="235" y1="345" x2="235" y2="304" class="nf s-orange " style="stroke-width:3;stroke-linecap:round" marker-end="url(#ar-orange)"/><text x="262" y="348" class="ts t-orange tb" >vapeurs</text><g transform="translate(320 236) rotate(21.3)"><rect x="0" y="-16" width="225" height="32" rx="5" class="glass" /><rect x="2" y="-14" width="221" height="28" rx="4" class="water" opacity=".5"/><rect x="-14" y="-5" width="253" height="10" rx="3" class="glass" /><rect x="196" y="16" width="11" height="16" rx="2" class="glass" /><rect x="22" y="-32" width="11" height="16" rx="2" class="glass" /><line x1="201.5" y1="52" x2="201.5" y2="34" class="nf s-blue " style="stroke-width:3;stroke-linecap:round" marker-end="url(#ar-blue)"/><line x1="27.5" y1="-34" x2="27.5" y2="-54" class="nf s-blue " style="stroke-width:3;stroke-linecap:round" marker-end="url(#ar-blue)"/></g><line x1="68" y1="112" x2="431.8" y2="112" class="rod" /><line x1="431.8" y1="112" x2="431.8" y2="273.6" class="rod" style="stroke-width:3"/><rect x="58" y="102" width="20" height="20" rx="4" class="metal" /><circle cx="50" cy="112" r="3.5" class="knob" /><rect x="418.8" y="265.6" width="26" height="28" rx="4" class="metal" transform="rotate(21.3 431.8 279.6)"/><path d="M541 320 Q551 326 548 352 V378" class="tube-o" style="stroke-width:14"/><path d="M541 320 Q551 326 548 352 V378" class="tube-i" style="stroke-width:10"/><circle cx="548" cy="388" r="2.4" class="f-blue" /><circle cx="548" cy="396" r="2.4" class="f-blue" /><rect x="535" y="398" width="26" height="46" rx="0" class="gfill" /><line x1="535" y1="398" x2="535" y2="442" class="glass-t" /><line x1="561" y1="398" x2="561" y2="442" class="glass-t" /><path d="M535 440 L482 560 H614 L561 440 Z" class="gfill" /><path d="M505 508 H591 L614 560 H482 Z" class="water" /><path d="M505 508 H591 L593 513 H503 Z" class="cryst" opacity=".9"/><circle cx="520" cy="530" r="2" class="bubble" /><circle cx="548" cy="540" r="2" class="bubble" /><circle cx="574" cy="528" r="2" class="bubble" /><circle cx="540" cy="520" r="2" class="bubble" /><path d="M535 440 L482 560 H614 L561 440" class="glass-t" /><line x1="535" y1="398" x2="561" y2="398" class="glass-t" style="opacity:.0"/><line x1="68" y1="330" x2="221" y2="330" class="rod" /><rect x="54" y="320" width="20" height="20" rx="4" class="metal" /><circle cx="50" cy="330" r="3.5" class="knob" /><rect x="217" y="322" width="36" height="16" rx="3" class="metal" /><text x="748" y="24" class="ts t-red tb te" >⚠ montage jamais fermé · ne pas chauffer à sec</text><g class="lab" data-n="1"><line class="lead" x1="300" y1="418" x2="327" y2="400"/><circle class="dotp" cx="300" cy="418" r="3.6"/><text class="lt" x="332" y="404">Ballon</text><text class="lt sub" x="332" y="418">eau + écorces (même ballon)</text><circle class="pin" cx="300" cy="418" r="10"/><text class="pn" x="300" y="418">1</text></g><g class="lab" data-n="2"><line class="lead" x1="244" y1="446" x2="327" y2="442"/><circle class="dotp" cx="244" cy="446" r="3.6"/><text class="lt" x="332" y="446">Anti-bouillonnement</text><text class="lt sub" x="332" y="460">pierre ponce ou agitation</text><circle class="pin" cx="244" cy="446" r="10"/><text class="pn" x="244" y="446">2</text></g><g class="lab" data-n="3"><line class="lead" x1="300" y1="490" x2="327" y2="516"/><circle class="dotp" cx="300" cy="490" r="3.6"/><text class="lt" x="332" y="520">Chauffe-ballon</text><text class="lt sub" x="332" y="534">chauffage électrique</text><circle class="pin" cx="300" cy="490" r="10"/><text class="pn" x="300" y="490">3</text></g><g class="lab" data-n="4"><line class="lead" x1="235" y1="540" x2="327" y2="554"/><circle class="dotp" cx="235" cy="540" r="3.6"/><text class="lt" x="332" y="558">Support élévateur</text><circle class="pin" cx="235" cy="540" r="10"/><text class="pn" x="235" y="540">4</text></g><g class="lab" data-n="5"><line class="lead" x1="235" y1="178" x2="257" y2="156"/><circle class="dotp" cx="235" cy="178" r="3.6"/><text class="lt" x="262" y="160">Thermomètre</text><text class="lt sub" x="262" y="174">(si prévu)</text><circle class="pin" cx="235" cy="178" r="10"/><text class="pn" x="235" y="178">5</text></g><g class="lab" data-n="6"><line class="lead" x1="242" y1="270" x2="257" y2="300"/><circle class="dotp" cx="242" cy="270" r="3.6"/><text class="lt" x="262" y="304">Tête de distillation</text><circle class="pin" cx="242" cy="270" r="10"/><text class="pn" x="242" y="270">6</text></g><g class="lab" data-n="7"><line class="lead" x1="437.6" y1="264.7" x2="465" y2="232"/><circle class="dotp" cx="437.6" cy="264.7" r="3.6"/><text class="lt" x="470" y="236">Réfrigérant à eau</text><circle class="pin" cx="437.6" cy="264.7" r="10"/><text class="pn" x="437.6" y="264.7">7</text></g><g class="lab" data-n="8"><line class="lead" x1="496.8" y1="351.1" x2="484" y2="372"/><circle class="dotp" cx="496.8" cy="351.1" r="3.6"/><text class="lt te" x="480" y="376">Entrée d'eau : en bas</text><circle class="pin" cx="496.8" cy="351.1" r="10"/><text class="pn" x="496.8" y="351.1">8</text></g><g class="lab" data-n="9"><line class="lead" x1="356.5" y1="218" x2="367" y2="192"/><circle class="dotp" cx="356.5" cy="218" r="3.6"/><text class="lt" x="372" y="196">Sortie d'eau : en haut</text><circle class="pin" cx="356.5" cy="218" r="10"/><text class="pn" x="356.5" y="218">9</text></g><g class="lab" data-n="10"><line class="lead" x1="561" y1="420" x2="627" y2="416"/><circle class="dotp" cx="561" cy="420" r="3.6"/><text class="lt" x="632" y="420">Récepteur ouvert</text><text class="lt sub" x="632" y="434">sans bouchon</text><circle class="pin" cx="561" cy="420" r="10"/><text class="pn" x="561" y="420">10</text></g><g class="lab" data-n="11"><line class="lead" x1="598" y1="548" x2="627" y2="516"/><circle class="dotp" cx="598" cy="548" r="3.6"/><text class="lt" x="632" y="520">Distillat</text><text class="lt sub" x="632" y="534">eau + huile (trouble)</text><circle class="pin" cx="598" cy="548" r="10"/><text class="pn" x="598" y="548">11</text></g><g class="lab" data-n="12"><line class="lead" x1="64" y1="226" x2="80" y2="222"/><circle class="dotp" cx="64" cy="226" r="3.6"/><text class="lt" x="84" y="222">Potence, noix et pinces</text><circle class="pin" cx="64" cy="226" r="10"/><text class="pn" x="64" y="226">12</text></g></svg>