<svg xmlns="http://www.w3.org/2000/svg" class="fig manip" width="1520" height="1180" viewBox="0 0 760 590" role="img" font-family="Arial, Helvetica, sans-serif" aria-label="Montage d'hydrodistillation d'une huile essentielle"><style>/* ============ TOKENS (clair) ============ */
:root {
  --bg: #f2f1ec;
  --surface: #ffffff;
  --surface-2: #f7f6f1;
  --ink: #16202e;
  --ink-2: #47556a;
  --ink-3: #8392a6;
  --line: #e3e1d9;
  --fig-bg: #fcfbf8;
  --glass: #e4f0fa;
  --liq-water: #b9dcf8;
  --liq-org: #fff0b3;
  --liq-sol: #c9e6fb;
  --metal: #bcc4d0;
  --mantle: #d8b98b;
  --box: #e8ebf0;
  --screen: #bfdcae;
  --screen-ink: #1d3a1a;

  --red: #d93636;    --red-l: #fde7e7;
  --blue: #2563eb;   --blue-l: #e4edff;
  --green: #12a150;  --green-l: #e0f5e8;
  --orange: #e8751a; --orange-l: #ffeedb;
  --purple: #7c4dff; --purple-l: #eee8ff;
  --teal: #0d9488;   --teal-l: #dcf5f2;
  --pink: #db2777;   --pink-l: #fde6f0;
}

/* ============ FIGURES SVG (classes utilitaires) ============ */
svg.fig { display: block; width: 100%; height: auto; max-width: 100%; font-family: inherit; }
svg.fig text { fill: var(--ink); font-size: 11px; font-weight: 600; }
svg.fig .ts  { font-size: 9.5px; font-weight: 500; }
svg.fig .tl  { font-size: 13px; font-weight: 700; }
svg.fig .tm  { fill: var(--ink-2); font-weight: 500; }
svg.fig .tb  { font-weight: 800; }
svg.fig .tc  { text-anchor: middle; }
svg.fig .te  { text-anchor: end; }
svg.fig .ax  { stroke: var(--ink-2); stroke-width: 1.6; fill: none; stroke-linecap: round; }
svg.fig .gr  { stroke: var(--line); stroke-width: 1; fill: none; }
svg.fig .ln  { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
svg.fig .thin{ stroke-width: 1.2; }
svg.fig .dash{ stroke-dasharray: 4 3; }
svg.fig .dot { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
svg.fig .nf  { fill: none; }
svg.fig text.halo { paint-order: stroke; stroke: var(--fig-bg); stroke-width: 4px; stroke-linejoin: round; }

svg.fig .s-red{stroke:var(--red)} svg.fig .s-blue{stroke:var(--blue)} svg.fig .s-green{stroke:var(--green)}
svg.fig .s-orange{stroke:var(--orange)} svg.fig .s-purple{stroke:var(--purple)} svg.fig .s-teal{stroke:var(--teal)}
svg.fig .s-pink{stroke:var(--pink)} svg.fig .s-gray{stroke:var(--ink-3)} svg.fig .s-ink{stroke:var(--ink)}
svg.fig .f-red{fill:var(--red)} svg.fig .f-blue{fill:var(--blue)} svg.fig .f-green{fill:var(--green)}
svg.fig .f-orange{fill:var(--orange)} svg.fig .f-purple{fill:var(--purple)} svg.fig .f-teal{fill:var(--teal)}
svg.fig .f-pink{fill:var(--pink)} svg.fig .f-ink{fill:var(--ink)} svg.fig .f-gray{fill:var(--ink-3)}
svg.fig .fl-red{fill:var(--red-l)} svg.fig .fl-blue{fill:var(--blue-l)} svg.fig .fl-green{fill:var(--green-l)}
svg.fig .fl-orange{fill:var(--orange-l)} svg.fig .fl-purple{fill:var(--purple-l)} svg.fig .fl-teal{fill:var(--teal-l)}
svg.fig .fl-pink{fill:var(--pink-l)}
svg.fig text.t-red{fill:var(--red)} svg.fig text.t-blue{fill:var(--blue)} svg.fig text.t-green{fill:var(--green)}
svg.fig text.t-orange{fill:var(--orange)} svg.fig text.t-purple{fill:var(--purple)} svg.fig text.t-teal{fill:var(--teal)}
svg.fig text.t-pink{fill:var(--pink)}

/* verrerie et matériel */
svg.fig .glass  { fill: var(--glass); stroke: var(--ink-2); stroke-width: 2; stroke-linejoin: round; }
svg.fig .glass-t{ fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.fig .tube-o { fill: none; stroke: var(--ink-2); stroke-linecap: round; stroke-linejoin: round; }
svg.fig .tube-i { fill: none; stroke: var(--glass); stroke-linecap: round; stroke-linejoin: round; }
svg.fig .gfill  { fill: var(--glass); stroke: none; }
svg.fig .water  { fill: var(--liq-water); }
svg.fig .org    { fill: var(--liq-org); }
svg.fig .sol    { fill: var(--liq-sol); }
svg.fig .metal  { fill: var(--metal); stroke: var(--ink-2); stroke-width: 1.4; stroke-linejoin: round; }
svg.fig .rod    { fill: none; stroke: var(--ink-2); stroke-width: 3; stroke-linecap: round; }
svg.fig .mantle { fill: var(--mantle); stroke: var(--ink-2); stroke-width: 1.6; stroke-linejoin: round; }
svg.fig .box    { fill: var(--box); stroke: var(--ink-2); stroke-width: 1.6; stroke-linejoin: round; }
svg.fig .screen { fill: var(--screen); stroke: var(--ink-2); stroke-width: 1.2; }
svg.fig text.lcd{ fill: var(--screen-ink); font-weight: 800; font-size: 15px; font-family: ui-monospace, Menlo, monospace; }
svg.fig .wire   { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.fig .bubble { fill: #fff; opacity: .75; }
svg.fig .rubber { fill: #6b7280; stroke: var(--ink-2); stroke-width: 1.2; }
svg.fig .paper  { fill: #fff; stroke: var(--ink-3); stroke-width: 1; }
svg.fig .cryst  { fill: var(--orange); opacity: .9; }
svg.fig .knob   { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.4; }
svg.fig .led-r  { fill: var(--red); }

/* légendes interactives (schémas de manip) */
svg.fig .lab .lead { stroke: var(--ink-3); stroke-width: 1.3; fill: none; }
svg.fig .lab .lt   { font-size: 13px; font-weight: 700; }
svg.fig .lab .lt.sub { font-size: 11px; font-weight: 500; fill: var(--ink-2); }
svg.fig .lab .pin  { fill: var(--pink); stroke: var(--surface); stroke-width: 2; display: none; }
svg.fig .lab .pn   { fill: #fff; font-size: 11px; font-weight: 800; text-anchor: middle; dominant-baseline: central; display: none; pointer-events: none; }
svg.fig .lab .dotp { fill: var(--ink-3); }
svg.fig.training .lab .pin, svg.fig.training .lab .pn { display: inline; }
svg.fig.training .lab .dotp { display: none; }
svg.fig.training .lab { cursor: pointer; }
svg.fig.training .lab .lt, svg.fig.training .lab .lead { opacity: 0; transition: opacity .2s; }
svg.fig.training .lab.revealed .lt, svg.fig.training .lab.revealed .lead { opacity: 1; }
svg.fig.training .lab.revealed .pin { fill: var(--green); }
</style><defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" fill="var(--ink)"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" fill="var(--red)"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" fill="var(--blue)"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" fill="var(--green)"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" fill="var(--orange)"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" fill="var(--purple)"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" fill="var(--ink-3)"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" fill="var(--teal)"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" fill="var(--pink)"/></marker></defs><rect width="760" h