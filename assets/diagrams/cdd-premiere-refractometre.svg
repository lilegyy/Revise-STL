s-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="700" >Oculaire</text><path d="M87 199L257 215" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="257" cy="215" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="601" y="217" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223d43" text-anchor="end" font-weight="700" >Prismes : ouvrir, déposer, refermer</text><path d="M601 223L451 321" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="451" cy="321" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="87" y="339" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="start" font-weight="700" >Compensateur : frontière nette</text><path d="M87 345L343 339" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="343" cy="339" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="88" y="451" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="start" font-weight="700" >Réglage de la frontière</text><path d="M88 457L322 422" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="322" cy="422" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><rect x="659" y="181" width="471" height="366" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="677" y="213" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >VUE DANS L’OCULAIRE</text><circle cx="894" cy="329" r="103" fill="#f8f8e8" stroke="#72858d" stroke-width="2" /><path d="M791 329A103 103 0 0 0 997 329Z" stroke="#72858d" stroke-width="1" fill="#7d8d91" stroke-linejoin="round" stroke-linecap="round" /><path d="M781 329L1006 329" stroke="#223d43" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M894 216L894 442" stroke="#223d43" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="894" y="480" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="middle" font-weight="700" >Frontière au centre du réticule</text><text x="894" y="513" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="middle" font-weight="400" >Lire n ; noter θ et la longueur d’onde.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Réaliser la lecture</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Étalonner avec une référence adaptée.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Déposer quelques gouttes sans bulle ni grain.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Nettoyer les prismes sans les rayer après usage.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Comparer à une valeur tabulée</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >n = c/v est sans unité ; dépend de θ et de λ.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Comparer des indices aux mêmes conditions.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La correction thermique dépend du liquide étudié.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>