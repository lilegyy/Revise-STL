" font-size="17" fill="#223d43" text-anchor="middle" font-weight="700" >Cristaux à laver avec peu de solvant froid</text><path d="M592 226L369 285" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="369" cy="285" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="88" y="356" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223d43" text-anchor="start" font-weight="700" >Adaptateur étanche</text><path d="M88 362L344 348" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="344" cy="348" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="356" y="558" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >Fiole à vide fixée</text><text x="655" y="549" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >Flacon de garde</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Retenir le solide et évacuer le filtrat</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Papier adapté à la surface perforée, sans pli.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Humidifier le filtre pour assurer son adhérence.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Verser sans dépasser le bord du papier.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Arrêter sans retour de liquide</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Rompre le vide avant d’arrêter l’aspiration.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le flacon de garde protège le circuit de vide.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ne pas aspirer de solvants avec un appareil inadapté.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>