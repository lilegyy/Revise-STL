<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Déchets chimiques : identifier avant de collecter</title><desc id="desc">La filière dépend de la composition réelle, des incompatibilités et des consignes locales du laboratoire.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >CDD · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Déchets chimiques : identifier avant de collecter</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >La filière dépend de la composition réelle, des incompatibilités et des consignes locales du laboratoire.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><path d="M134 301L134 476Q134 492 149 492L299 492Q314 492 314 476L314 301Z" stroke="#72858d" stroke-width="2" fill="#dce5e5" stroke-linejoin="round" stroke-linecap="round" /><rect x="118" y="282" width="212" height="23" rx="4" fill="#2863b5" stroke="#72858d" stroke-width="1.5" /><rect x="178" y="265" width="90" height="17" rx="4" fill="#a7b8bd" stroke="#72858d" stroke-width="1.5" /><rect x="153" y="342" width="142" height="98" rx="5" fill="#fffdf6" stroke="#a9b8b9" stroke-width="1.5" /><text x="223" y="368" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="middle" font-weight="700" >CONTENU</text><text x="223" y="396" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#223d43" text-anchor="middle" font-weight="400" >nom + dangers</text><text x="223" y="421" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#223d43" text-anchor="middle" font-weight="400" >date + responsable</text><text x="223" y="535" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >Déchet liquide</text><path d="M499 301L499 476Q499 492 514 492L664 492Q679 492 679 476L679 301Z" stroke="#72858d" stroke-width="2" fill="#dce5e5" stroke-linejoin="round" stroke-linecap="round" /><rect x="483" y="282" width="212" height="23" rx="4" fill="#bb7a18" stroke="#72858d" stroke-width="1.5" /><rect x="543" y="265" width="90" height="17" rx="4" fill="#a7b8bd" stroke="#72858d" stroke-width="1.5" /><rect x="518" y="342" width="142" height="98" rx="5" fill="#fffdf6" stroke="#a9b8b9" stroke-width="1.5" /><text x="588" y="368" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bb7a18" text-anchor="middle" font-weight="700" >CONTENU</text><text x="588" y="396" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#223d43" text-anchor="middle" font-weight="400" >nom + dangers</text><text x="588" y="421" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#223d43" text-anchor="middle" font-weight="400" >date + responsable</text><text x="588" y="535" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >Déchet solide</text><path d="M864 301L864 476Q864 492 879 492L1029 492Q1044 492 1044 476L1044 301Z" stroke="#72858d" stroke-width="2" fill="#dce5e5" stroke-linejoin="round" stroke-linecap="round" /><rect x="848" y="282" width="212" height="23" rx="4" fill="#9064bd" stroke="#72858d" stroke-width="1.5" /><rect x="908" y="265" width="90" height="17" rx="4" fill="#a7b8bd" stroke="#72858d" stroke-width="1.5" /><rect x="883" y="342" width="142" height="98" rx="5" fill="#fffdf6" stroke="#a9b8b9" stroke-width="1.5" /><text x="953" y="368" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9064bd" text-anchor="middle" font-weight="700" >CONTENU</text><text x="953" y="396" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#223d43" text-anchor="middle" font-weight="400" >nom + dangers</text><text x="953" y="421" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#223d43" text-anchor="middle" font-weight="400" >date + responsable</text><text x="953" y="535" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >Verrerie contaminée</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Organiser la collecte</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Étiqueter clairement, fermer le récipient compatible.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ne pas mélanger des déchets sans consigne.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Conserver les informations sur les substances présentes.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Ne pas improviser l’élimination</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Aucun rejet à l’évier sans consigne autorisée.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Les catégories illustrées ne fixent pas la filière.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Appliquer les règles et récipients du laboratoire.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>