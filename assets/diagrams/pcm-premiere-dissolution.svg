ke-width="1.5" /><text x="188" y="469" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >m en g</text><circle cx="295" cy="461" r="10" fill="#fff" stroke="#72858d" stroke-width="2" /><rect x="130" y="405" width="198" height="15" rx="5" fill="#bbcbd2" stroke="#72858d" stroke-width="1.5" /><path d="M171 383L287 383L272 404L185 404Z" stroke="#72858d" stroke-width="2" fill="#eef3f3" stroke-linejoin="round" stroke-linecap="round" /><path d="M193 382Q203 358 217 366Q228 348 242 365Q259 362 267 382Z" stroke="#bb7a18" stroke-width="1.5" fill="#eadab5" stroke-linejoin="round" stroke-linecap="round" /><path d="M226 314L304 269" stroke="#72858d" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M291 273L317 260L325 273L303 285Z" stroke="#72858d" stroke-width="2" fill="#cfdae0" stroke-linejoin="round" stroke-linecap="round" /><text x="230" y="340" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="middle" font-weight="400" >Coupelle tarée + spatule</text><g transform="translate(608 299) scale(0.94)"><defs><clipPath id="f608299"><path d="M-13 0L-13 90C-13 103 -63 110 -68 157C-76 219 76 219 68 157C63 110 13 103 13 90L13 0Z"/></clipPath></defs><rect x="-80" y="151" width="160" height="170" rx="0" fill="#afd4e8" stroke="none" stroke-width="1.5" clip-path="url(#f608299)" fill-opacity=".65"/><path d="M-13 0L-13 90C-13 103 -63 110 -68 157C-76 219 76 219 68 157C63 110 13 103 13 90L13 0Z" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M-18 56L18 56" stroke="#c75454" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="0" y="169" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="middle" font-weight="700" >Vf</text></g><path d="M564 278L651 278L620 319L620 346L598 346L598 319Z" stroke="#72858d" stroke-width="2" fill="#e4f1f6" stroke-linejoin="round" stroke-linecap="round" /><path d="M512 246L551 248L552 286L535 291L519 275Z" stroke="#72858d" stroke-width="2" fill="#e5f0f4" stroke-linejoin="round" stroke-linecap="round" /><path d="M536 259Q552 265 586 289" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="602" y="530" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="middle" font-weight="400" >Rincer bécher et entonnoir</text><g transform="translate(970 275) scale(1)"><defs><clipPath id="f970275"><path d="M-13 0L-13 90C-13 103 -63 110 -68 157C-76 219 76 219 68 157C63 110 13 103 13 90L13 0Z"/></clipPath></defs><rect x="-80" y="52" width="160" height="170" rx="0" fill="#afd4e8" stroke="none" stroke-width="1.5" clip-path="url(#f970275)" fill-opacity=".65"/><path d="M-13 0L-13 90C-13 103 -63 110 -68 157C-76 219 76 219 68 157C63 110 13 103 13 90L13 0Z" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M-18 56L18 56" stroke="#c75454" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M-12 52Q0 60 12 52" stroke="#2863b5" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="0" y="169" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="middle" font-weight="700" >Vf</text></g><path d="M988 239L1024 221L1032 231L995 250Z" stroke="#72858d" stroke-width="2" fill="#d1dde2" stroke-linejoin="round" stroke-linecap="round" /><path d="M977 257Q971 266 977 270Q984 266 977 257Z" stroke="#2863b5" stroke-width="1" fill="#9acbe0" stroke-linejoin="round" stroke-linecap="round" /><text x="1120" y="285" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="end" font-weight="700" >Trait de jauge</text><path d="M1120 291L988 331" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="988" cy="331" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="1113" y="394" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="end" font-weight="700" >Bas du ménisque</text><path d="M1113 400L970 331" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="970" cy="331" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="972" y="530" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >À hauteur des yeux</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Calculer la masse à peser</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >n = c × Vf ; m = n × M = c × Vf × M.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Vf est le volume final de solution, en L.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Dissoudre complètement avant d’ajuster le volume.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Assurer le transfert et le volume</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Rincer les récipients : conserver tout le soluté.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Finir goutte à goutte ; ménisque tangent au trait.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Boucher puis homogénéiser par retournements.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>