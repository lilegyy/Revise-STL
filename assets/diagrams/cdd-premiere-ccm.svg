 préparer et lire</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Comparer les taches dans les mêmes conditions ; une coïncidence de Rf soutient une identification.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="131" y="229" width="318" height="284" rx="12" fill="url(#glass)" stroke="#72858d" stroke-width="1.5" /><rect x="121" y="212" width="338" height="18" rx="5" fill="#c9d6d9" stroke="#72858d" stroke-width="1.5" /><rect x="137" y="467" width="306" height="40" rx="4" fill="#bbd9e8" stroke="none" stroke-width="1.5" /><rect x="194" y="254" width="193" height="236" rx="2" fill="#fbfbef" stroke="#72858d" stroke-width="1.5" /><path d="M197 446L384 446" stroke="#223d43" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="232" cy="445" r="5" fill="#9064bd" stroke="#9064bd" stroke-width="2" /><circle cx="290" cy="445" r="5" fill="#9064bd" stroke="#9064bd" stroke-width="2" /><circle cx="348" cy="445" r="5" fill="#9064bd" stroke="#9064bd" stroke-width="2" /><path d="M420 426L420 297" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="287" y="525" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >Cuve fermée pendant l’élution</text><text x="73" y="351" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223d43" text-anchor="start" font-weight="700" >Ligne de dépôt au crayon</text><path d="M73 357L196 446" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="196" cy="446" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="71" y="554" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#223d43" text-anchor="start" font-weight="700" >Niv