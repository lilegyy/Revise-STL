arker-end="url(#arr-blue)" marker-start="url(#arr-blue)"/><text x="997" y="352" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >H</text><path d="M643 466L643 334" stroke="#9064bd" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="619" y="408" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#9064bd" text-anchor="middle" font-weight="700" >h</text><text x="809" y="537" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >Exemple illustratif : Rf(A) = h/H = 0,60</text><text x="1111" y="195" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="end" font-weight="700" >Front de l’éluant marqué aussitôt</text><path d="M1111 201L925 246" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="925" cy="246" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Avant et pendant l’élution</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Dépôts petits et secs ; ne pas creuser la couche.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ligne de dépôt hors de l’éluant, cuve immobile.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Choisir la révélation et respecter ses protections.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Interpréter la plaque</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Rf = distance dépôt→tache / dépôt→front.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >M contient au moins les espèces visibles A et B.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Une tache unique ne prouve pas une pureté absolue.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>