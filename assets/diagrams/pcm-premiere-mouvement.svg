<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Décrire un mouvement dans un référentiel</title><desc id="desc">Positions à intervalles de temps égaux : la trajectoire et l’évolution de la vitesse sont deux informations distinctes.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >PCM · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Décrire un mouvement dans un référentiel</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Positions à intervalles de temps égaux : la trajectoire et l’évolution de la vitesse sont deux informations distinctes.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><text x="91" y="212" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >RECTILIGNE UNIFORME</text><path d="M90 285L1100 285" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arr-gray)" /><circle cx="161" cy="285" r="10" fill="#28776e" stroke="#28776e" stroke-width="2" /><text x="161" y="324" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="middle" font-weight="700" >G0</text><path d="M161 272L237 272" stroke="#28776e" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><circle cx="365" cy="285" r="10" fill="#28776e" stroke="#28776e" stroke-width="2" /><text x="365" y="324" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="middle" font-weight="700" >G1</text><path d="M365 272L441 272" stroke="#28776e" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><circle cx="569" cy="285" r="10" fill="#28776e" stroke="#28776e" stroke-width="2" /><text x="569" y="324" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="middle" font-weight="700" >G2</text><path d="M569 272L645 272" stroke="#28776e" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><circle cx="773" cy="285" r="10" fill="#28776e" stroke="#28776e" stroke-width="2" /><text x="773" y="324" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="middle" font-weight="700" >G3</text><path d="M773 272L849 272" stroke="#28776e" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><circle cx="977" cy="285" r="10" fill="#28776e" stroke="#28776e" stroke-width="2" /><text x="977" y="324" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="middle" font-weight="700" >G4</text><path d="M977 272L1053 272" stroke="#28776e" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><text x="1091" y="330" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#72858d" text-anchor="end" font-weight="400" >x →</text><text x="91" y="362" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >RECTILIGNE ACCÉLÉRÉ</text><path d="M90 435L1100 435" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arr-gray)" /><circle cx="161" cy="435" r="10" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><text x="161" y="474" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2863b5" text-anchor="middle" font-weight="700" >G0</text><path d="M161 422L191 422" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><circle cx="252" cy="435" r="10" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><text x="252" y="474" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2863b5" text-anchor="middle" font-weight="700" >G1</text><path d="M252 422L307 422" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><circle cx="420" cy="435" r="10" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><text x="420" y="474" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2863b5" text-anchor="middle" font-weight="700" >G2</text><path d="M420 422L500 422" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><circle cx="665" cy="435" r="10" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><text x="665" y="474" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2863b5" text-anchor="middle" font-weight="700" >G3</text><path d="M665 422L770 422" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><circle cx="977" cy="435" r="10" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><text x="977" y="474" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2863b5" text-anchor="middle" font-weight="700" >G4</text><path d="M977 422L1107 422" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="1091" y="480" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#72858d" text-anchor="end" font-weight="400" >x →</text><rect x="750" y="176" width="364" height="54" rx="8" fill="#edf5f2" stroke="none" stroke-width="1.5" /><text x="932" y="211" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="middle" font-weight="700" >Δt identique entre deux positions</text><text x="91" y="532" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Un espacement croissant indique une vitesse qui augmente.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >D’abord choisir le référentiel</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Nommer le système et le point représentatif G.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Donner le référentiel et le repère, avec les unités.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La trajectoire dépend du référentiel choisi.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Lire la chronophotographie</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Comparer les distances pour une même durée Δt.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Écart constant : valeur de vitesse constante.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Une trajectoire courbe peut aussi être uniforme.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>