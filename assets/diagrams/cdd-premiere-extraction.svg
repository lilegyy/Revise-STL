8" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Deux solvants non miscibles ; le composé se répartit selon son affinité pour chaque phase.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="122" y="203" width="8" height="332" rx="2" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><rect x="75" y="535" width="102" height="14" rx="3" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><rect x="115" y="291" width="22" height="16" rx="3" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><path d="M137 299L316 299" stroke="#72858d" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M312 285Q334 299 312 313" stroke="#72858d" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(337 350) scale(1)"><defs><clipPath id="sep14"><path d="M-16 -132L-16 -103C-70 -93 -92 -42 -65 11L-13 85L-13 106L13 106L13 85L65 11C92 -42 70 -93 16 -103L16 -132"/></clipPath></defs><rect x="-90" y="-73" width="180" height="55" rx="0" fill="#f2d18f" stroke="none" stroke-width="1.5" clip-path="url(#sep14)" fill-opacity=".7"/><rect x="-90" y="-18" width="180" height="126" rx="0" fill="#a9d6e8" stroke="none" stroke-width="1.5" clip-path="url(#sep14)" fill-opacity=".7"/><path d="M-72 -18L72 -18" stroke="#2863b5" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M-16 -132L-16 -103C-70 -93 -92 -42 -65 11L-13 85L-13 106L13 106L13 85L65 11C92 -42 70 -93 16 -103L16 -132" stroke="#72858d" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M-22 -140L22 -140L16 -126L-16 -126Z" stroke="#72858d" stroke-width="2" fill="#b9d4db" stroke-linejoin="round" stroke-linecap="round" /><rect x="-23" y="105" width="46" height="13" rx="3" fill="#dbe6e8" stroke="#72858d" stroke-width="1.5" /><path d="M-34 111L34 111" stroke="#c75454" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M-4 118L-4 148L4 148L4 118" stroke="#72858d" stroke-width="2" fill="#d9eff7" stroke-linejoin="round" stroke-linecap="round" /></g><defs><clipPath id="erl337502"><path d="M323 502L323 539L282.0 536Q280.0 546 290.0 546L384.0 546Q394.0 546 392.0 536L351 539L351 502"/></clipPath></defs><rect x="227" y="537.2" width="220" height="44" rx="0" fill="#b6dbe7" stroke="none" stroke-width="1.5" clip-path="url(#erl337502)" fill-opacity=".8"/><path d="M323 502L323 539L282.0 536Q280.0 546 290.0 546L384.0 546Q394.0 546 392.0 536L351 539L351 502" stroke="#72858d" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M323.0 537.2L351.0 537.2" stroke="#2863b5" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="550" y="215" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="end" font-weight="700" >Bouchon maintenu pendant l’agitation</text><path d="M550 221L351 217" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="351" cy="217" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="610" y="295" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="end" font-weight="700" >Phase supérieure : moins dense</text><path d="M610 301L393 297" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="393" cy="297" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="610" y="356" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="end" font-weight="700" >Phase inférieure : plus dense</text><path d="M610 362L380 364" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="380" cy="364" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="611" y="418" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="end" font-weight="700" >Robinet fermé avant remplissage</text><path d="M611 424L353 461" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="353" cy="461" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="322" y="565" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#28776e" text-anchor="middle" font-weight="400" >Collecter séparément ; conserver les deux phases.</text><rect x="682" y="181" width="448" height="366" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="700" y="213" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >AGITER, DÉGAZER, DÉCANTER</text><g transform="translate(838 317) rotate(-140)"><g transform="translate(0 0) scale(0.48)"><defs><clipPath id="sep45"><path d="M-16 -132L-16 -103C-70 -93 -92 -42 -65 11L-13 85L-13 106L13 106L13 85L65 11C92 -42 70 -93 16 -103L16 -132"/></clipPath></defs><path d="M-16 -132L-16 -103C-70 -93 -92 -42 -65 11L-13 85L-13 106L13 106L13 85L65 11C92 -42 70 -93 16 -103L16 -132" stroke="#72858d" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M-22 -140L22 -140L16 -126L-16 -126Z" stroke="#72858d" stroke-width="2" fill="#b9d4db" stroke-linejoin="round" stroke-linecap="round" /><rect x="-23" y="105" width="46" height="13" rx="3" fill="#dbe6e8" stroke="#72858d" stroke-width="1.5" /><path d="M-34 111L34 111" stroke="#c75454" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M-4 118L-4 148L4 148L4 118" stroke="#72858d" stroke-width="2" fill="#d9eff7" stroke-linejoin="round" stroke-linecap="round" /></g></g><path d="M884 263Q929 256 955 230" stroke="#28776e" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)"/><text x="707" y="392" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >1. Tenir bouchon et robinet ; retourner.</text><text x="707" y="421" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >2. Ouvrir vers la hotte pour dégazer.</text><text x="707" y="450" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >3. Fermer ; agiter puis dégazer souvent.</text><text x="707" y="479" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >4. Reposer ; attendre l’interface nette.</text><text x="707" y="508" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >5. Ôter le bouchon avant soutirage.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Identifier les phases avant de séparer</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >La phase organique n’est pas toujours au-dessus.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Utiliser densités et, si nécessaire, un test à l’eau.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le volume ajouté peut déplacer l’interface.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Choisir le solvant et exploiter</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Non miscible ; composé plus soluble dans l’extracteur.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >K = cB / cA à l’équilibre, pour le modèle étudié.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Plusieurs petites extractions sont souvent préférables.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>