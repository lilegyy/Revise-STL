<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="1000" height="500" fill="#fffdf7"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#285f65"/></marker></defs><g font-family="sans-serif" font-size="23" fill="#285f65"><text x="45" y="65">Recristalliser : séparer le produit et les impuretés</text><rect x="30" y="130" width="200" height="190" rx="15" fill="#e4eeee" stroke="#285f65" stroke-width="3"/><text x="45" y="175">1 · À chaud</text><text x="45" y="230" font-size="20">Minimum de solvant</text><path d="M240 225h45" stroke="#285f65" stroke-width="4" marker-end="url(#arr)"/><rect x="275" y="130" width="200" height="190" rx="15" fill="#e4eeee" stroke="#285f65" stroke-width="3"/><text x="290" y="175">2 · Refroidir</text><text x="290" y="230" font-size="20">Former les cristaux</text><path d="M485 225h45" stroke="#285f65" stroke-width="4" marker-end="url(#arr)"/><rect x="520" y="130" width="200" height="190" rx="15" fill="#e4eeee" stroke="#285f65" stroke-width="3"/><text x="535" y="175">3 · Filtrer</text><text x="535" y="230" font-size="20">Peu de lavage froid</text><path d="M730 225h45" stroke="#285f65" stroke-width="4" marker-end="url(#arr)"/><rect x="765" y="130" width="200" height="190" rx="15" fill="#e4eeee" stroke="#285f65" stroke-width="3"/><text x="780" y="175">4 · Sécher</text><text x="780" y="230" font-size="20">Peser le solide sec</text><text x="90" y="390">Impuretés insolubles : filtration à chaud si nécessaire.</text><text x="90" y="440">Impuretés solubles : éliminer les eaux mères au lavage.</text></g></svg>