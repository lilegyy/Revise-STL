<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Trois alcènes issus de la déshydratation du 4-méthylpentan-2-ol</title>
<desc id="desc">Deux carbones voisins du carbone portant OH peuvent fournir un hydrogène. L'alcène terminal n'a pas d'isomérie E Z. L'alcène interne existe en E, groupes prioritaires opposés, et Z, groupes prioritaires du même côté. Le modèle ne considère pas de réarrangement.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#547d76"/></marker></defs>
<rect width="1200" height="920" fill="#f3f5f0"/><rect x="22" y="22" width="1156" height="876" rx="22" fill="#fffefa" stroke="#dbe2dd"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#243f45">
<text x="48" y="62" font-size="16" font-weight="bold" fill="#28776e">PREMIÈRE · CDD · CORRECTION CHAPITRE 6</text>
<text x="48" y="108" font-size="30" font-weight="bold">Déshydratation : deux positions, trois alcènes</text>
<text x="48" y="144" font-size="18" fill="#657b80">Éliminer OH et un H porté par un carbone β ; conserver tous les carbones.</text>
<rect x="120" y="175" width="960" height="130" rx="14" fill="#f2f7f4" stroke="#d5e2db"/>
<text x="600" y="211" text-anchor="middle" font-size="21" font-weight="bold">4-méthylpentan-2-ol</text>
<text x="600" y="252" text-anchor="middle" font-size="29">CH₃—CH(OH)—CH₂—CH(CH₃)—CH₃</text>
<text x="600" y="284" text-anchor="middle" font-size="17">C1 est β à gauche ; C3 est β à droite du C2 portant OH.</text>
<g fill="none" stroke="#547d76" stroke-width="2.5" marker-end="url(#arrow)"><path d="M340 305L220 350"/><path d="M600 305L590 350"/><path d="M860 305L990 350"/></g>
<text x="600" y="165" text-anchor="middle" font-size="14" fill="#28776e">H⁺ catalytique · chauffage · formation de H₂O</text>
<rect x="48" y="368" width="340" height="315" rx="14" fill="#fff" stroke="#dbe2dd"/>
<rect x="409" y="368" width="365" height="315" rx="14" fill="#fff" stroke="#dbe2dd"/>
<rect x="795" y="368" width="357" height="315" rx="14" fill="#fff" stroke="#dbe2dd"/>
<text x="218" y="406" text-anchor="middle" font-size="21" font-weight="bold">Alcène terminal</text>
<text x="591" y="406" text-anchor="middle" font-size="21" font-weight="bold">Alcène interne : (E)</text>
<text x="973" y="406" text-anchor="middle" font-size="21" font-weight="bold">Alcène interne : (Z)</text>
<text x="218" y="506" text-anchor="middle" font-size="25">CH₂=CH—CH₂—R</text>
<text x="218" y="557" text-anchor="middle" font-size="19" font-weight="bold">4-méthylpent-1-ène</text>
<text x="218" y="598" text-anchor="middle" font-size="17">C1 porte deux H identiques :</text>
<text x="218" y="624" text-anchor="middle" font-size="17">pas d’isomérie E/Z.</text>
<g stroke="#394d51" stroke-width="2.5" fill="none"><path d="M535 500H647M535 510H647M521 488L488 457M521 520L488 554M660 488L696 457M660 520L696 554"/><path d="M912 500H1024M912 510H1024M898 488L864 457M898 520L864 554M1037 488L1072 457M1037 520L1072 554"/></g>
<g font-size="25" text-anchor="middle"><text x="522" y="514">C</text><text x="660" y="514">C</text><text x="477" y="450" fill="#28776e" font-weight="bold">CH₃</text><text x="477" y="582">H</text><text x="705" y="450">H</text><text x="705" y="582" fill="#28776e" font-weight="bold">R</text><text x="899" y="514">C</text><text x="1037" y="514">C</text><text x="853" y="450" fill="#28776e" font-weight="bold">CH₃</text><text x="853" y="582">H</text><text x="1081" y="450" fill="#28776e" font-weight="bold">R</text><text x="1081" y="582">H</text></g>
<text x="591" y="624" text-anchor="middle" font-size="17">CH₃ et R de côtés opposés</text><text x="973" y="624" text-anchor="middle" font-size="17">CH₃ et R du même côté</text>
<text x="591" y="655" text-anchor="middle" font-size="17" font-weight="bold">(E)-4-méthylpent-2-ène</text><text x="973" y="655" text-anchor="middle" font-size="17" font-weight="bold">(Z)-4-méthylpent-2-ène</text>
<rect x="48" y="708" width="1104" height="135" rx="14" fill="#f2f7f4" stroke="#d5e2db"/>
<text x="72" y="744" font-size="22" font-weight="bold" fill="#28776e">R = CH(CH₃)—CH₃</text>
<text x="72" y="778" font-size="18">Sur chaque C de la double liaison interne, le groupe carboné est prioritaire sur H.</text>
<text x="72" y="811" font-size="18">Bilan de chaque élimination : alcool C₆H₁₄O → alcène C₆H₁₂ + H₂O.</text>
<text x="48" y="875" font-size="14" fill="#657b80">Schéma de correction · Modèle de β-élimination du sujet, sans réarrangement ni proportion de produits inventée.</text>
</g></svg>
