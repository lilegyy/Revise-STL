<text x="1000" y="407" font-size="18" fill="#c14b55" text-anchor="middle">1 groupe CH₃ : 3 H</text>
<text x="843" y="318" font-size="18" fill="#9b6334" text-anchor="middle">1 H acide</text>
<text x="575" y="717" font-size="16" fill="#657b80" text-anchor="middle">Formule développée : tous les H sont écrits ; doublets non liants non dessinés.</text>
<rect x="48" y="753" width="1104" height="241" rx="14" fill="#f2f7f4" stroke="#d5e2db"/>
<text x="72" y="789" font-size="22" font-weight="bold">Six groupes, huit protons au total</text>
<text x="72" y="829" font-size="19" fill="#c14b55">CH₃ : 3 H → signal vers 2,3 ppm</text>
<text x="72" y="864" font-size="19" fill="#8b53a5">H3 : 1 H → vers 7,15 ppm</text>
<text x="72" y="899" font-size="19" fill="#a97614">H4 : 1 H → vers 7,6 ppm</text>
<text x="645" y="829" font-size="19" fill="#2863b5">H5 : 1 H → vers 7,35 ppm</text>
<text x="645" y="864" font-size="19" fill="#28776e">H6 : 1 H → vers 8,0 ppm</text>
<text x="645" y="899" font-size="19" fill="#9b6334">COOH : 1 H → hors fenêtre / échange</text>
<text x="72" y="950" font-size="17">Les positions aromatiques sont des attributions cohérentes, pas une preuve fournie par ce seul tracé.</text>
<text x="48" y="1031" font-size="14" fill="#657b80">Lecture RMN approximative du sujet · Un signal vers 5 ppm reste non attribué sans données de solvant/impuretés.</text>
</g></svg>
