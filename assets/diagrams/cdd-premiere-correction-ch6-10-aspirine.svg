<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">Formule développée de l'aspirine et groupes de protons</title>
<desc id="desc">L'aspirine possède un cycle aromatique avec COOH sur C1 et OCOCH3 sur C2. Les quatre protons aromatiques H3 à H6 sont non équivalents. Les trois protons du méthyle sont équivalents en solution usuelle. Le proton de l'acide est un sixième groupe. Tous les atomes H et toutes les liaisons sont explicités ; les doublets non liants ne sont pas représentés.</desc>
<rect width="1200" height="1080" fill="#f3f5f0"/><rect x="22" y="22" width="1156" height="1036" rx="22" fill="#fffefa" stroke="#dbe2dd"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#243f45">
<text x="48" y="62" font-size="16" font-weight="bold" fill="#28776e">PREMIÈRE · CDD · CORRECTION CHAPITRE 8</text>
<text x="48" y="108" font-size="30" font-weight="bold">Aspirine : formule développée et groupes de H</text>
<text x="48" y="144" font-size="18" fill="#657b80">C₉H₈O₄ · Les couleurs regroupent les protons chimiquement équivalents.</text>
<rect x="48" y="171" width="1104" height="560" rx="14" fill="#fff" stroke="#dbe2dd"/>
<g stroke="#394d51" stroke-width="3" fill="none">
