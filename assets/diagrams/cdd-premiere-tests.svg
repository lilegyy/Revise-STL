<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Tests de reconnaissance : observer et interpréter</title><desc id="desc">Utiliser un témoin et des réactifs adaptés ; un résultat positif doit être interprété avec les limites du test.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >CDD · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Tests de reconnaissance : observer et interpréter</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Utiliser un témoin et des réactifs adaptés ; un résultat positif doit être interprété avec les limites du test.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><text x="207" y="218" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="middle" font-weight="700" >ION Cu²⁺ + HO⁻</text><path d="M173 268L173 443Q207 486 241 443L241 268" stroke="#72858d" stroke-width="2.4" fill="#f7fbfc" stroke-linejoin="round" stroke-linecap="round" /><rect x="177" y="360" width="60" height="73" rx="0" fill="#c2dfe9" stroke="none" stroke-width="1.5" fill-opacity=".45"/><path d="M176 435Q190 420 203 435Q220 423 238 435Q234 461 207 470Q179 460 176 435Z" stroke="#4a9ed2" stroke-width="1" fill="#4a9ed2" stroke-linejoin="round" stroke-linecap="round" /><path d="M230 251L276 225L282 234L238 260Z" stroke="#72858d" stroke-width="2" fill="#d7e6e9" stroke-linejoin="round" stroke-linecap="round" /><path d="M220 280Q213 290 220 295Q227 290 220 280Z" stroke="#2863b5" stroke-width="1" fill="#aacddd" stroke-linejoin="round" stroke-linecap="round" /><text x="207" y="522" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >Précipité bleu</text><text x="585" y="218" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="middle" font-weight="700" >CARBONYLE + DNPH</text><path d="M551 268L551 443Q585 486 619 443L619 268" stroke="#72858d" stroke-width="2.4" fill="#f7fbfc" stroke-linejoin="round" stroke-linecap="round" /><rect x="555" y="360" width="60" height="73" rx="0" fill="#c2dfe9" stroke="none" stroke-width="1.5" fill-opacity=".45"/><path d="M554 435Q568 420 581 435Q598 423 616 435Q612 461 585 470Q557 460 554 435Z" stroke="#e4ac3c" stroke-width="1" fill="#e4ac3c" stroke-linejoin="round" stroke-linecap="round" /><path d="M608 251L654 225L660 234L616 260Z" stroke="#72858d" stroke-width="2" fill="#d7e6e9" stroke-linejoin="round" stroke-linecap="round" /><path d="M598 280Q591 290 598 295Q605 290 598 280Z" stroke="#2863b5" stroke-width="1" fill="#aacddd" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="522" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >Précipité jaune-orangé</text><text x="964" y="218" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="middle" font-weight="700" >TÉMOIN</text><path d="M930 268L930 443Q964 486 998 443L998 268" stroke="#72858d" stroke-width="2.4" fill="#f7fbfc" stroke-linejoin="round" stroke-linecap="round" /><rect x="934" y="360" width="60" height="73" rx="0" fill="#c2dfe9" stroke="none" stroke-width="1.5" fill-opacity=".45"/><path d="M987 251L1033 225L1039 234L995 260Z" stroke="#72858d" stroke-width="2" fill="#d7e6e9" stroke-linejoin="round" stroke-linecap="round" /><path d="M977 280Q970 290 977 295Q984 290 977 280Z" stroke="#2863b5" stroke-width="1" fill="#aacddd" stroke-linejoin="round" stroke-linecap="round" /><text x="964" y="522" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >Réactif + solvant seuls</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Concevoir les contrôles</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Témoin négatif : vérifier la contribution du réactif.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Témoin positif si nécessaire : valider le test.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Préciser couleur, aspect et conditions d’observation.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Conclure au bon niveau</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >DNPH : met en évidence un groupe carbonyle adapté.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ne distingue pas à elle seule aldéhyde et cétone.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Interférences et seuil de détection limitent le résultat.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>