<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"><rect width="1000" height="460" fill="#fffdf7"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#285f65"/></marker></defs><g font-family="sans-serif" font-size="22" fill="#285f65"><text x="45" y="55" font-size="22">Les deux sondes mesurent le même milieu stabilisé</text><rect x="55" y="135" width="260" height="170" rx="12" fill="#e3eeeb" stroke="#285f65" stroke-width="2"/><text x="88" y="195" font-size="22">Bain agité</text><text x="85" y="240" font-size="22">ou étalon connu</text><rect x="535" y="95" width="400" height="105" rx="12" fill="#e3eeeb" stroke="#285f65" stroke-width="2"/><rect x="535" y="245" width="400" height="105" rx="12" fill="#e3eeeb" stroke="#285f65" stroke-width="2"/><text x="575" y="150" font-size="22">Sonde de référence → E</text><text x="570" y="300" font-size="22">Capteur étudié → S</text><path d="M330 180L520 147" stroke="#285f65" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M330 260L520 295" stroke="#285f65" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="100" y="420" font-size="22">Table de paires (E ; S) → ajustement S = aE + b → E = (S − b)/a</text></g></svg>