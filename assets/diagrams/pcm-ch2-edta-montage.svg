<title id="t">Dosage à l’EDTA : un titrage à pH proche de 10</title>
<desc id="d">Montage de titrage : burette de 25 mL contenant l’EDTA au-dessus d’un erlenmeyer posé sur un agitateur magnétique, contenant l’échantillon, le tampon et le NET. Le virage va du rouge-violet au bleu persistant.</desc>
