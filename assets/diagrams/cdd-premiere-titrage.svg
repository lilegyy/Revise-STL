roke-linecap="round" /><path d="M967 371L984 371" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M967 380L984 380" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M967 389L984 389" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M971 316Q987 332 1003 316" stroke="#2863b5" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M1016 326L1092 326" stroke="#c75454" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" /><text x="1025" y="454" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#28776e" text-anchor="middle" font-weight="700" >Bas du ménisque</text><text x="1025" y="485" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#223d43" text-anchor="middle" font-weight="400" >Œil à sa hauteur</text><text x="1025" y="515" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#28776e" text-anchor="middle" font-weight="700" >VE = Vf − Vi</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Avant de commencer</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Rincer et conditionner burette et pipette adaptées.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Purger la pointe ; noter le volume initial Vi.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Choisir un suivi : pH, conductivité ou indicateur.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >À l’équivalence</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >a A + b B → produits : nA,0/a = nB,E/b.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Pour les solutions : cA VA/a = cB VE/b.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le volume au repérage n’est pas toujours VE exact.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>