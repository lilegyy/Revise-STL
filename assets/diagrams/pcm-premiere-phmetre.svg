<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Mesurer le pH : étalonner, rincer, attendre</title><desc id="desc">Montage de mesure : une électrode immergée dans la solution, sans toucher le fond ni l’agitateur.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >PCM · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Mesurer le pH : étalonner, rincer, attendre</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Montage de mesure : une électrode immergée dans la solution, sans toucher le fond ni l’agitateur.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="99" y="240" width="295" height="220" rx="12" fill="#dce5e9" stroke="#72858d" stroke-width="1.5" /><rect x="124" y="268" width="245" height="92" rx="6" fill="#d5e8b6" stroke="#28776e" stroke-width="1.5" /><text x="247" y="326" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#28776e" text-anchor="middle" font-weight="700" >pH  —,—</text><circle cx="160" cy="411" r="15" fill="#edf3f3" stroke="#72858d" stroke-width="2" /><circle cx="223" cy="411" r="15" fill="#edf3f3" stroke="#72858d" stroke-width="2" /><circle cx="287" cy="411" r="15" fill="#edf3f3" stroke="#72858d" stroke-width="2" /><text x="163" y="202" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="start" font-weight="700" >pH-mètre</text><path d="M389 275Q585 162 804 274" stroke="#223d43" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="635" y="207" width="9" height="303" rx="2" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><rect x="588" y="507" width="105" height="15" rx="4" fill="url(#metal)" stroke="#72858d" stroke-width="1.5" /><path d="M641 295L801 295" stroke="#72858d" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="788" y="278" width="33" height="28" rx="4" fill="#b7c6ce" stroke="#72858d" stroke-width="1.5" /><rect x="799" y="267" width="16" height="173" rx="5" fill="#e4eef1" stroke="#72858d" stroke-width="1.5" /><circle cx="807" cy="443" r="9" fill="#d7e5e9" stroke="#72858d" stroke-width="2" /><path d="M726 361L726 488Q726 496 736 496L892 496Q902 496 902 488L902 361" stroke="#72858d" stroke-width="2.2" fill="n