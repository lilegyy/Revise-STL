e si adaptée</text><path d="M1118 561L900 515" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="900" cy="515" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><path d="M128 473L128 513Q128 521 138 521L185 521Q195 521 195 513L195 473" stroke="#72858d" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="131" y="489.8" width="61" height="28.19999999999999" rx="0" fill="#cbe2ce" stroke="none" stroke-width="1.5" fill-opacity=".7"/><path d="M131 489.8L192 489.8" stroke="#2863b5" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M177 481.0L191 481.0" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M177 489.0L191 489.0" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M177 497.0L191 497.0" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M177 505.0L191 505.0" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="161" y="544" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="middle" font-weight="700" >pH 7</text><path d="M271 473L271 513Q271 521 281 521L328 521Q338 521 338 513L338 473" stroke="#72858d" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="274" y="489.8" width="61" height="28.19999999999999" rx="0" fill="#cbe2ce" stroke="none" stroke-width="1.5" fill-opacity=".7"/><path d="M274 489.8L335 489.8" stroke="#2863b5" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M320 481.0L334 481.0" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M320 489.0L334 489.0" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M320 497.0L334 497.0" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M320 505.0L334 505.0" stroke="#72858d" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="304" y="544" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="middle" font-weight="700" >pH 4 ou 10</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Étalonner avant les mesures</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Employer deux tampons adaptés à la plage attendue.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Rincer entre les tampons et avant l’échantillon.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Éponger doucement ; ne pas frotter la membrane.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Obtenir une lecture fiable</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Attendre une valeur stable ; noter la température.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Éviter bulles, contact avec fond et barreau.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Conserver la sonde selon la notice, jamais au sec.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>