<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Relier masse, volume et quantité de matière</title><desc id="desc">Chaque relation exige des unités cohérentes : vérifier l’espèce concernée avant de calculer.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >PCM · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Relier masse, volume et quantité de matière</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Chaque relation exige des unités cohérentes : vérifier l’espèce concernée avant de calculer.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><circle cx="251" cy="327" r="85" fill="#f2f7f3" stroke="#28776e" stroke-width="2" /><text x="251" y="340" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#28776e" text-anchor="middle" font-weight="700" >m</text><text x="251" y="454" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#28776e" text-anchor="middle" font-weight="700" >masse (g)</text><circle cx="600" cy="327" r="85" fill="#f2f7f3" stroke="#2863b5" stroke-width="2" /><text x="600" y="340" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#2863b5" text-anchor="middle" font-weight="700" >n</text><text x="600" y="454" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2863b5" text-anchor="middle" font-weight="700" >quantité (mol)</text><circle cx="950" cy="327" r="85" fill="#f2f7f3" stroke="#9064bd" stroke-width="2" /><text x="950" y="340" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#9064bd" text-anchor="middle" font-weight="700" >N</text><text x="950" y="454" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9064bd" text-anchor="middle" font-weight="700" >nombre d’entités</text><path d="M352 309L490 309" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="420" y="283" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#72858d" text-anchor="middle" font-weight="700" >÷ M</text><path d="M490 345L352 345" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="420" y="383" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#72858d" text-anchor="middle" font-weight="700" >× M</text><path d="M704 309L842 309" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="773" y="283" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#72858d" text-anchor="middle" font-weight="700" >× NA</text><path d="M842 345L704 345" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="773" y="383" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#72858d" text-anchor="middle" font-weight="700" >÷ NA</text><text x="92" y="205" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#28776e" text-anchor="start" font-weight="700" >M : masse molaire en g·mol⁻¹       NA ≈ 6,022 × 10²³ mol⁻¹</text><rect x="119" y="486" width="962" height="58" rx="10" fill="#edf5f2" stroke="none" stroke-width="1.5" /><text x="600" y="523" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#28776e" text-anchor="middle" font-weight="700" >Liquide : m = ρ × V       Solution : n = c × Vsolution</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Masse volumique et concentration</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >ρ = masse totale de l’échantillon / volume.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >cm = masse du soluté / volume de solution.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Pour une espèce dissoute : cm = c × M.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Garder les unités compatibles</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >n = m / M : g et g·mol⁻¹ donnent mol.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >c en mol·L⁻¹ : volume de solution en litres.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >1 mL = 10⁻³ L ; pureté de 90 % → p = 0,90.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>