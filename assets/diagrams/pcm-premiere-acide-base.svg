<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Acide-base : transfert de proton et prédominance</title><desc id="desc">À 25 °C, pH neutre ≈ 7 ; un couple acide/base diffère d’un proton H⁺.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >PCM · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Acide-base : transfert de proton et prédominance</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >À 25 °C, pH neutre ≈ 7 ; un couple acide/base diffère d’un proton H⁺.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="80" y="189" width="1040" height="147" rx="12" fill="#f2f7f3" stroke="#dde7df" stroke-width="1.5" /><text x="248" y="244" font-family="Arial, Helvetica, sans-serif" font-size="41" fill="#c75454" text-anchor="middle" font-weight="700" >AH</text><text x="440" y="244" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#72858d" text-anchor="middle" font-weight="400" >+</text><text x="601" y="244" font-family="Arial, Helvetica, sans-serif" font-size="41" fill="#2863b5" text-anchor="middle" font-weight="700" >B</text><path d="M728 236L820 236" stroke="#72858d" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" marker-start="url(#arr-gray)"/><text x="881" y="244" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#c75454" text-anchor="middle" font-weight="700" >A⁻</text><text x="958" y="244" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#72858d" text-anchor="middle" font-weight="400" >+</text><text x="1062" y="244" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#2863b5" text-anchor="middle" font-weight="700" >BH⁺</text><path d="M248 275Q430 338 601 275" stroke="#28776e" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)"/><text x="427" y="312" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >H⁺ est transféré</text><text x="249" y="205" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c75454" text-anchor="middle" font-weight="400" >Acide : donne H⁺</text><text x="600" y="205" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="middle" font-weight="400" >Base : capte H⁺</text><rect x="101" y="408" width="498" height="65" rx="6" fill="#f8e5de" stroke="none" stroke-width="1.5" /><rect x="600" y="408" width="497" height="65" rx="6" fill="#e2edf7" stroke="none" stroke-width="1.5" /><path d="M600 385L600 495" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M101 474L1115 474" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="345" y="449" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#c75454" text-anchor="middle" font-weight="700" >AH prédomine</text><text x="846" y="449" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#2863b5" text-anchor="middle" font-weight="700" >A⁻ prédomine</text><text x="596" y="376" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#28776e" text-anchor="middle" font-weight="700" >pH = pKa</text><text x="596" y="530" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#28776e" text-anchor="middle" font-weight="700" >[AH] = [A⁻]</text><text x="1109" y="505" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#72858d" text-anchor="end" font-weight="400" >pH →</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Écrire une réaction acido-basique</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >AH / A⁻ : AH ⇌ A⁻ + H⁺.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Assembler donneur et accepteur pour éliminer H⁺.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Vérifier les atomes et la charge électrique totale.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Relier le pH aux ions oxonium</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >pH ≈ −log₁₀([H₃O⁺]) avec [H₃O⁺] en mol·L⁻¹.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >[H₃O⁺] ≈ 10⁻pH mol·L⁻¹.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le pKa fixe la frontière de prédominance du couple.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>