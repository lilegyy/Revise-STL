<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Bilan de matière : suivre une transformation</title><desc id="desc">Les coefficients stœchiométriques relient les quantités consommées et formées ; l’avancement est en moles.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >CDD · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Bilan de matière : suivre une transformation</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Les coefficients stœchiométriques relient les quantités consommées et formées ; l’avancement est en moles.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><text x="600" y="217" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#28776e" text-anchor="middle" font-weight="700" >a A + b B → p P + q Q</text><text x="320" y="285" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#28776e" text-anchor="middle" font-weight="700" >A</text><text x="541" y="285" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#28776e" text-anchor="middle" font-weight="700" >B</text><text x="761" y="285" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#28776e" text-anchor="middle" font-weight="700" >P</text><text x="982" y="285" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#28776e" text-anchor="middle" font-weight="700" >Q</text><path d="M83 309L1116 309" stroke="#72858d" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M83 374L1116 374" stroke="#72858d" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M83 438L1116 438" stroke="#72858d" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M83 509L1116 509" stroke="#72858d" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="95" y="350" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#223d43" text-anchor="start" font-weight="700" >Initial</text><text x="95" y="415" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#223d43" text-anchor="start" font-weight="700" >Variation</text><text x="95" y="485" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#223d43" text-anchor="start" font-weight="700" >Final</text><text x="320" y="350" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#223d43" text-anchor="middle" font-weight="400" >nA,0</text><text x="320" y="415" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c75454" text-anchor="middle" font-weight="700" >−a ξ</text><text x="320" y="485" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#223d43" text-anchor="middle" font-weight="400" >nA,0 − a ξ</text><text x="541" y="350" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#223d43" text-anchor="middle" font-weight="400" >nB,0</text><text x="541" y="415" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c75454" text-anchor="middle" font-weight="700" >−b ξ</text><text x="541" y="485" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#223d43" text-anchor="middle" font-weight="400" >nB,0 − b ξ</text><text x="761" y="350" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#223d43" text-anchor="middle" font-weight="400" >0</text><text x="761" y="415" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#2863b5" text-anchor="middle" font-weight="700" >+p ξ</text><text x="761" y="485" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#223d43" text-anchor="middle" font-weight="400" >p ξ</text><text x="982" y="350" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#223d43" text-anchor="middle" font-weight="400" >0</text><text x="982" y="415" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#2863b5" text-anchor="middle" font-weight="700" >+q ξ</text><text x="982" y="485" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#223d43" text-anchor="middle" font-weight="400" >q ξ</text><text x="602" y="549" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#28776e" text-anchor="middle" font-weight="700" >ξmax = min(nA,0/a ; nB,0/b), pour une transformation totale du modèle.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Identifier le réactif limitant</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Calculer chaque rapport ninitial/coefficient.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le plus petit rapport fixe ξmax.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ne pas choisir le limitant par la plus petite masse.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Calculer ce qui est demandé</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >nP,théorique = p ξmax si P est absent initialement.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >mP,théorique = nP,théorique × MP.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Conserver les unités et la nature de chaque espèce.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>