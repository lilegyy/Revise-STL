<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img"><rect width="100%" height="100%" rx="18" fill="#fffefa"/><g stroke="#243f35" stroke-width="2.5" fill="none" stroke-linecap="round"><text x="400" y="35" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#243f35" stroke="none">Hydrodistillation : eau + végétal dans le même ballon</text><g transform="translate(0 45)"><circle cx="150" cy="230" r="70"/><path d="M130 163V105H170V163M85 260Q150 285 215 260"/><path d="M130 105V80H310L590 210"/><path d="M302 63L610 205M293 88L599 232M330 60L617 191M288 110L581 249"/><path d="M590 235V310H712V235"/><path d="M602 290H700"/><path d="M565 251V291H490" stroke="#4476a0"/><path d="M340 50V25H415" stroke="#4476a0"/><path d="M104 314H197V351H104Z" fill="#faece4"/><text x="150" y="390" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#243f35" stroke="none">Chauffage électrique</text><text x="150" y="236" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#243f35" stroke="none">Eau + écorces</text><text x="480" y="90" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#243f35" stroke="none">Vapeurs eau + huile</text><text x="650" y="282" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#243f35" stroke="none">Distillat</text><text x="473" y="314" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#243f35" stroke="none">Entrée d’eau : en bas</text><text x="490" y="60" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#243f35" stroke="none">Sortie d’eau : en haut</text><text x="675" y="358" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#243f35" stroke="none">Récepteur ouvert</text><text x="400" y="445" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#243f35" stroke="none">Montage fixé, jamais fermé ; ne pas chauffer à sec.</text></g></g></svg>