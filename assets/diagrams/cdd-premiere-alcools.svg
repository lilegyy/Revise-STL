<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Réactivité des alcools : distinguer trois transformations</title><desc id="desc">L’oxygène porte des doublets ; une protonation peut transformer –OH en meilleur groupe partant.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >CDD · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Réactivité des alcools : distinguer trois transformations</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >L’oxygène porte des doublets ; une protonation peut transformer –OH en meilleur groupe partant.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="70" y="190" width="1058" height="112" rx="10" fill="#f4f8f4" stroke="#dce5df" stroke-width="1.5" /><text x="91" y="218" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="start" font-weight="700" >ÉLIMINATION</text><text x="603" y="250" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#223d43" text-anchor="middle" font-weight="700" >CH₃–CH₂–OH → CH₂=CH₂ + H₂O</text><text x="603" y="284" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="400" >Déshydratation ; catalyse acide, conditions adaptées.</text><rect x="70" y="315" width="1058" height="112" rx="10" fill="#f4f8f4" stroke="#dce5df" stroke-width="1.5" /><text x="91" y="343" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="start" font-weight="700" >SUBSTITUTION</text><text x="603" y="375" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#223d43" text-anchor="middle" font-weight="700" >(CH₃)₂CHOH + HCl → (CH₃)₂CHCl + H₂O</text><text x="603" y="409" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="400" >Remplacement de –OH par Cl dans ce bilan.</text><rect x="70" y="440" width="1058" height="112" rx="10" fill="#f4f8f4" stroke="#dce5df" stroke-width="1.5" /><text x="91" y="468" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="start" font-weight="700" >ACIDE-BASE</text><text x="603" y="500" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#223d43" text-anchor="middle" font-weight="700" >ROH + B⁻ ⇌ RO⁻ + HB</text><text x="603" y="534" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="400" >Former un alcoolate exige une base suffisamment forte.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Lire les transformations</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Élimination : départ d’atomes, liaison multiple formée.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Substitution : groupe remplacé par un autre.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Acide-base : transfert d’un proton.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Interpréter un mécanisme</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Flèche courbe : déplacement d’un doublet électronique.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Catalyseur : consommé puis régénéré.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Intermédiaire : formé puis consommé au cours des étapes.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>