ont-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Objectif modélisé</text><path d="M448 206L540 264" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="540" cy="264" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="655" y="200" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Diaphragme</text><path d="M655 206L589 278" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="589" cy="278" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="834" y="200" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Obturateur ouvert</text><path d="M834 206L805 293" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="805" cy="293" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="1047" y="202" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Capteur CCD / CMOS</text><path d="M1047 208L960 278" stroke="#72858d" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="960" cy="278" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="665" y="511" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >Faire la mise au point : déplacer l’objectif / ses lentilles.</text><path d="M492 534L614 534" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" marker-start="url(#arr-gray)"/><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Attribuer chaque fonction</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Objectif : forme l’image ; capteur : reçoit la lumière.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Diaphragme : règle le diamètre D de l’ouverture.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Obturateur : règle la durée d’exposition Δt.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Réaliser la mise au point</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Image avant ou derrière le capteur → photographie floue.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Image exactement sur le capteur → photographie nette.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le zoom optique modifie f′ ; le focus règle la netteté.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Les couleurs distinguent les trajets ou les éléments, pas toujours la couleur de la lumière.</text></svg>