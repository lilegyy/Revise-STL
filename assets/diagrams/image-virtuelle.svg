<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Loupe : une image virtuelle droite et agrandie</title><desc id="desc">Objet entre F et O : les rayons ne se croisent pas après la lentille ; seuls leurs prolongements se coupent.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >SPCL · PREMIÈRE · IMAGE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Loupe : une image virtuelle droite et agrandie</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >Objet entre F et O : les rayons ne se croisent pas après la lentille ; seuls leurs prolongements se coupent.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><path d="M90 414L1100 414" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arr-gray)" /><text x="1080" y="442" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#72858d" text-anchor="end" font-weight="400" >axe optique →</text><path d="M700 299.0Q673 414 700 529.0Q727 414 700 299.0" stroke="#2863b5" stroke-width="2" fill="url(#glass)" stroke-linejoin="round" stroke-linecap="round" /><path d="M700 293.0L700 535.0" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" marker-start="url(#arr-blue)"/><circle cx="700" cy="414" r="3" fill="#2863b5" stroke="#2863b5" stroke-width="2" /><text x="700" y="280.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2863b5" text-anchor="middle" font-weight="700" >Lentille convergente</text><path d="M580 414L580 324" stroke="#28776e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><path d="M460 414L460 234" stroke="#c75454" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arr-red)" /><circle cx="460" cy="414" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="460" y="440" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="400" >A′ = F ici</text><circle cx="580" cy="414" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="580" y="440" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="400" >A</text><circle cx="700" cy="414" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="700" y="440" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="400" >O</text><circle cx="940" cy="414" r="3" fill="#72858d" stroke="#72858d" stroke-width="2" /><text x="940" y="440" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="400" >F′</text><text x="562" y="312" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="end" font-weight="700" >B</text><text x="442" y="222" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c75454" text-anchor="end" font-weight="700" >B′</text><path d="M580 324L700 324L1060 459" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M642.4 324.0L652.0 324.0" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M887.2 394.2L916.0 405.0" stroke="#2863b5" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><path d="M580 324L700 414L810 496.5" stroke="#bb7a18" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M642.4 370.8L652.0 378.0" stroke="#bb7a18" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><path d="M757.2 456.9L766.0 463.5" stroke="#bb7a18" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><path d="M460 234L700 324" stroke="#2863b5" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" /><path d="M460 234L700 414" stroke="#bb7a18" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" /><text x="991" y="234" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Œil observateur</text><path d="M1040 459Q1064 437 1090 459Q1064 481 1040 459" stroke="#72858d" stroke-width="2" fill="#f8faf9" stroke-linejoin="round" stroke-linecap="round" /><circle cx="1052" cy="456" r="8" fill="#28776e" stroke="#28776e" stroke-width="2" /><text x="324" y="200" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c75454" text-anchor="start" font-weight="700" >Prolongements imaginés</text><path d="M580 523L580 539" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M700 523L700 539" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M580 531L700 531" stroke="#72858d" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" marker-start="url(#arr-gray)"/><rect x="565.4" y="506" width="149.2" height="25" rx="4" fill="#fff" stroke="none" stroke-width="1.5" /><text x="640.0" y="525" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="700" >OA = −f′ / 2</text><path d="M460 488L460 504" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M700 488L700 504" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M460 496L700 496" stroke="#72858d" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" marker-start="url(#arr-gray)"/><rect x="521.3" y="471" width="117.39999999999999" height="25" rx="4" fill="#fff" stroke="none" stroke-width="1.5" /><text x="580.0" y="490" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="700" >OA′ = −f′</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Construire les rayons réels</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >B → O : trajet rectiligne.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >B → parallèle à l’axe : ressort en direction de F′.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >L’œil reçoit un faisceau divergent après la lentille.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Construire les prolongements</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Prolonger vers l’arrière les rayons émergents.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ils se coupent en B′ : image virtuelle, γ &gt; 0.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Impossible de recueillir cette image sur un écran.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Les couleurs distinguent les trajets ou les éléments, pas toujours la couleur de la lumière.</text></svg>