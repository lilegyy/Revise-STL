<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Travail d’une force constante : le signe compte</title><desc id="desc">WAB(F) = F × AB × cos(α) ; α est l’angle entre la force et le déplacement orienté de A vers B.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >PCM · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Travail d’une force constante : le signe compte</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >WAB(F) = F × AB × cos(α) ; α est l’angle entre la force et le déplacement orienté de A vers B.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="71" y="181" width="318" height="365" rx="12" fill="#f7faf8" stroke="#e0e7e2" stroke-width="1.5" /><text x="229" y="217" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#28776e" text-anchor="middle" font-weight="700" >MOTEUR</text><rect x="172" y="340" width="114" height="51" rx="8" fill="#b4ccd3" stroke="#72858d" stroke-width="1.5" /><circle cx="196" cy="395" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="262" cy="395" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="229" cy="371" r="4" fill="#223d43" stroke="#223d43" stroke-width="2" /><path d="M91 410L369 410" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M229 371L325.99484522385717 315.0" stroke="#28776e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><text x="330.99484522385717" y="307.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="start" font-weight="700" >F</text><path d="M113 455L345 455" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="229" y="486" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="400" >Déplacement A → B</text><text x="229" y="265" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="middle" font-weight="700" >α = 30°</text><text x="229" y="532" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="middle" font-weight="700" >W &gt; 0</text><rect x="442" y="181" width="318" height="365" rx="12" fill="#f7faf8" stroke="#e0e7e2" stroke-width="1.5" /><text x="600" y="217" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#c75454" text-anchor="middle" font-weight="700" >RÉSISTANT</text><rect x="543" y="340" width="114" height="51" rx="8" fill="#b4ccd3" stroke="#72858d" stroke-width="1.5" /><circle cx="567" cy="395" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="633" cy="395" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="600" cy="371" r="4" fill="#223d43" stroke="#223d43" stroke-width="2" /><path d="M462 410L740 410" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M600 371L503.00515477614283 315.0" stroke="#c75454" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-red)" /><text x="508.00515477614283" y="307.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c75454" text-anchor="start" font-weight="700" >F</text><path d="M484 455L716 455" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="600" y="486" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="400" >Déplacement A → B</text><text x="600" y="265" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#c75454" text-anchor="middle" font-weight="700" >α = 150°</text><text x="600" y="532" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c75454" text-anchor="middle" font-weight="700" >W &lt; 0</text><rect x="813" y="181" width="318" height="365" rx="12" fill="#f7faf8" stroke="#e0e7e2" stroke-width="1.5" /><text x="971" y="217" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#2863b5" text-anchor="middle" font-weight="700" >NUL</text><rect x="914" y="340" width="114" height="51" rx="8" fill="#b4ccd3" stroke="#72858d" stroke-width="1.5" /><circle cx="938" cy="395" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="1004" cy="395" r="12" fill="#edf2f2" stroke="#72858d" stroke-width="3" /><circle cx="971" cy="371" r="4" fill="#223d43" stroke="#223d43" stroke-width="2" /><path d="M833 410L1111 410" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M971 371L971.0 259.0" stroke="#2863b5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="976.0" y="251.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#2863b5" text-anchor="start" font-weight="700" >F</text><path d="M855 455L1087 455" stroke="#72858d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="971" y="486" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="400" >Déplacement A → B</text><text x="971" y="265" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="middle" font-weight="700" >α = 90°</text><text x="971" y="532" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#2863b5" text-anchor="middle" font-weight="700" >W = 0</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Relier orientation et transfert</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >α &lt; 90° : travail moteur ; α &gt; 90° : résistant.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >α = 90° : force perpendiculaire, travail nul.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >F en N, AB en m → W en J.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Cas du poids</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >WAB(P) = mg × (zA − zB), axe z vers le haut.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Descente : travail positif ; montée : négatif.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Le travail du poids ne dépend pas du chemin.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>