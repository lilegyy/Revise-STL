Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >N × √2 → éclairement ÷ 2.</text><text x="93" y="508" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Petite ouverture : PDC accrue.</text><rect x="485" y="258" width="201" height="98" rx="9" fill="#dce5e9" stroke="#72858d" stroke-width="1.5" /><rect x="519" y="277" width="124" height="58" rx="2" fill="#fff8d2" stroke="#bb7a18" stroke-width="1.5" /><rect x="504" y="270" width="15" height="72" rx="0" fill="#788d97" stroke="none" stroke-width="1.5" /><rect x="643" y="270" width="15" height="72" rx="0" fill="#788d97" stroke="none" stroke-width="1.5" /><path d="M469 390L729 390" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><path d="M482 387V366H604V387H718" stroke="#2863b5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M482 415L482 431" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M604 415L604 431" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M482 423L604 423" stroke="#72858d" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" marker-start="url(#arr-gray)"/><rect x="521.4" y="398" width="43.2" height="25" rx="4" fill="#fff" stroke="none" stroke-width="1.5" /><text x="543.0" y="417" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="700" >Δt</text><text x="461" y="461" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >1/250 s → 1/125 s : durée × 2.</text><text x="461" y="491" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >À puissance fixe : énergie × 2.</text><text x="461" y="521" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Risque de flou de mouvement.</text><rect x="843" y="253" width="99" height="105" rx="5" fill="#efd58d" stroke="#72858d" stroke-width="1.5" /><circle cx="852" cy="264" r="1.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="883" cy="287" r="1.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="914" cy="310" r="1.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="864" cy="333" r="1.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="895" cy="276" r="1.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="926" cy="299" r="1.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="876" cy="322" r="1.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="907" cy="265" r="1.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="857" cy="288" r="1.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="888" cy="311" r="1.5" fill="#9a7657" stroke="none" stroke-width="2" /><text x="893" y="390" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#9064bd" text-anchor="middle" font-weight="700" >ISO 100</text><rect x="1001" y="253" width="99" height="105" rx="5" fill="#efd58d" stroke="#72858d" stroke-width="1.5" /><circle cx="1010" cy="264" r="2.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="1041" cy="287" r="2.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="1072" cy="310" r="2.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="1022" cy="333" r="2.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="1053" cy="276" r="2.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="1084" cy="299" r="2.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="1034" cy="322" r="2.5" fill="#9a7657" stroke="none" stroke-width="2" /><circle cx="1065" cy="265" r="2.5" fill="#9a7657