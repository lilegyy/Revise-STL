rois réglages, trois effets différents</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >À scène et cadrage fixes : davantage de lumière reçue ou davantage d’amplification rend l’image plus claire.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="72" y="182" width="315" height="364" rx="12" fill="#f7faf8" stroke="#dee5e0" stroke-width="1.5" /><text x="90" y="215" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >OUVERTURE</text><rect x="442" y="182" width="315" height="364" rx="12" fill="#f7faf8" stroke="#dee5e0" stroke-width="1.5" /><text x="460" y="215" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >TEMPS DE POSE</text><rect x="812" y="182" width="315" height="364" rx="12" fill="#f7faf8" stroke="#dee5e0" stroke-width="1.5" /><text x="830" y="215" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#9064bd" text-anchor="start" font-weight="700" >SENSIBILITÉ ISO</text><circle cx="159" cy="308" r="51" fill="#7a8d96" stroke="#72858d" stroke-width="2" /><circle cx="159" cy="308" r="28" fill="#fff9cc" stroke="#223d43" stroke-width="2" /><path d="M189.0 308.0L193.1386287580111 343.15044845407664" stroke="#c0cbd0" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M174.0 333.98076211353316L145.62813306335977 355.1401439818419" stroke="#c0cbd0" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M144.0 333.98076211353316L111.48950430534865 319.9896955277653" stroke="#c0cbd0" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M129.0 308.0L124.86137124198888 272.8495515459234" stroke="#c0cbd0" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="roun