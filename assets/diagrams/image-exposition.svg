 800</text><text x="831" y="442" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >ISO ↑ : amplification ↑.</text><text x="831" y="475" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >L’énergie reçue ne change pas.</text><text x="831" y="508" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Bruit plus visible / saturation.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Énergie reçue et éclairement</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Qray = Pray × Δt ; Een = Pray / S.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >H = Een × Δt est l’exposition énergétique.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >À scène fixe, l’éclairement varie environ comme 1/N².</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Conserver une exposition équivalente</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >f/4 et 1/250 s → f/5,6 et 1/125 s (≈).</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Même énergie reçue, effets photographiques différents.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >L’ISO amplifie le signal : il ne crée pas de photons.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Les couleurs distinguent les trajets ou les éléments, pas toujours la couleur de la lumière.</text></svg>