<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Préparer puis contrôler une solution tampon</title>
<desc id="d">Quatre étapes : calculer et peser, dissoudre, compléter au trait de jauge, contrôler le pH au pH-mètre étalonné. Puis étiqueter la solution.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#345e4e"/></marker>
<clipPath id="fiole"><path d="M551 222V278C551 292 508 298 508 326C508 354 524 362 560 362C596 362 612 354 612 326C612 298 569 292 569 278V222Z"/></clipPath></defs>
<rect width="900" height="600" rx="18" fill="#fffefa"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#243f35">
<text x="450" y="40" font-size="25" text-anchor="middle">Préparer puis contrôler une solution tampon</text>
<rect x="25" y="62" width="850" height="70" rx="14" fill="#e8eedb" stroke="#8ea391"/>
<text x="450" y="96" font-size="24" text-anchor="middle" font-weight="bold">pH = pKa + log ( n(A⁻) / n(AH) )</text>
<text x="450" y="119" font-size="15" text-anchor="middle" fill="#4f6a5e">Relation de Henderson-Hasselbalch   ·   n = C × V   ·   m = n × M</text>
<rect x="25" y="148" width="190" height="310" rx="16" fill="#f4f6ec" stroke="#8ea391"/>
<circle cx="52" cy="178" r="14" fill="#345e4e"/>
<text x="52" y="184" font-size="17" text-anchor="middle" fill="#fffefa" font-weight="bold">1</text>
<text x="75" y="185" font-size="21" font-weight="bold">Calculer</text>
<path d="M39 204H201" stroke="#d6dccb" stroke-width="2"/>
<text x="120" y="395" font-size="14" text-anchor="middle">Fixer le rapport A⁻/AH,</text>
<text x="120" y="415" font-size="14" text-anchor="middle">puis n = C × V et m = n × M.</text>
<text x="120" y="435" font-size="14" text-anchor="middle">Tarer la nacelle, peser.</text>
<path d="M219 178H239" stroke="#345e4e" stroke-width="3" marker-end="url(#arr)"/>
<rect x="245" y="148" width="190" height="310" rx="16" fill="#f4f6ec" stroke="#8ea391"/>
<circle cx="272" cy="178" r="14" fill="#345e4e"/>
<text x="272" y="184" font-size="17" text-anchor="middle" fill="#fffefa" font-weight="bold">2</text>
<text x="295" y="185" font-size="21" font-weight="bold">Dissoudre</text>
<path d="M259 204H421" stroke="#d6dccb" stroke-width="2"/>
<text x="340" y="395" font-size="14" text-anchor="middle">Dissoudre dans un peu</text>
<text x="340" y="415" font-size="14" text-anchor="middle">d’eau (moins que le volume</text>
<text x="340" y="435" font-size="14" text-anchor="middle">final), sous agitation.</text>
<path d="M439 178H459" stroke="#345e4e" stroke-width="3" marker-end="url(#arr)"/>
<rect x="465" y="148" width="190" height="310" rx="16" fill="#f4f6ec" stroke="#8ea391"/>
<circle cx="492" cy="178" r="14" fill="#345e4e"/>
<text x="492" y="184" font-size="17" text-anchor="middle" fill="#fffefa" font-weight="bold">3</text>
<text x="515" y="185" font-size="21" font-weight="bold">Compléter</text>
<path d="M479 204H641" stroke="#d6dccb" stroke-width="2"/>
<text x="560" y="395" font-size="14" text-anchor="middle">Transvaser et rincer,</text>
<text x="560" y="415" font-size="14" text-anchor="middle">compléter jusqu’au trait</text>
<text x="560" y="435" font-size="14" text-anchor="middle">de jauge, homogénéiser.</text>
<path d="M659 178H679" stroke="#345e4e" stroke-width="3" marker-end="url(#arr)"/>
<rect x="685" y="148" width="190" height="310" rx="16" fill="#f4f6ec" stroke="#8ea391"/>
<circle cx="712" cy="178" r="14" fill="#345e4e"/>
<text x="712" y="184" font-size="17" text-anchor="middle" fill="#fffefa" font-weight="bold">4</text>
<text x="735" y="185" font-size="21" font-weight="bold">Contrôler</text>
<path d="M699 204H861" stroke="#d6dccb" stroke-width="2"/>
<text x="780" y="395" font-size="14" text-anchor="middle">pH-mètre étalonné.</text>
<text x="780" y="415" font-size="14" text-anchor="middle">Attendre la stabilisation</text>
<text x="780" y="435" font-size="14" text-anchor="middle">avant de lire le pH.</text>
<rect x="58" y="320" width="124" height="46" rx="9" fill="#e0e7de" stroke="#345e4e" stroke-width="2.5"/>
<rect x="116" y="312" width="8" height="10" fill="#cfd6cc" stroke="#345e4e" stroke-width="2"/>
<ellipse cx="120" cy="312" rx="46" ry="6" fill="#cfd6cc" stroke="#345e4e" stroke-width="2.5"/>
