x="178" y="444" width="29" height="29" rx="0" fill="#89b987" stroke="#fff" stroke-width="0.8" /><rect x="207" y="444" width="29" height="29" rx="0" fill="#89b987" stroke="#fff" stroke-width="0.8" /><rect x="236" y="444" width="29" height="29" rx="0" fill="#89b987" stroke="#fff" stroke-width="0.8" /><rect x="265" y="444" width="29" height="29" rx="0" fill="#89b987" stroke="#fff" stroke-width="0.8" /><rect x="294" y="444" width="29" height="29" rx="0" fill="#89b987" stroke="#fff" stroke-width="0.8" /><rect x="323" y="444" width="29" height="29" rx="0" fill="#89b987" stroke="#fff" stroke-width="0.8" /><rect x="352" y="444" width="29" height="29" rx="0" fill="#89b987" stroke="#fff" stroke-width="0.8" /><rect x="207" y="328" width="29" height="29" rx="0" fill="none" stroke="#c75454" stroke-width="3" /><text x="231" y="519" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="middle" font-weight="700" >10 × 8 = 80 pixels</text><path d="M240 344L458 292M240 344L458 423" stroke="#72858d" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="451" y="241" width="237" height="237" rx="8" fill="#b74c26" stroke="#72858d" stroke-width="1.5" /><text x="570" y="518" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="middle" font-weight="700" >Un pixel de couleur uniforme</text><text x="711" y="202" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >CODAGE RVB : 8 + 8 + 8 BITS</text><rect x="708" y="235" width="411" height="53" rx="7" fill="#f4f7f5" stroke="#e0e7e1" stroke-width="1.5" /><text x="726" y="268" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c75454" text-anchor="start" font-weight="700" >R = 183</text><text x="854" y="268" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#223d43" text-anchor="start" font-weight="400" letter-spacing="3">10110111</text><rect x="708" y="304" width="411" height="53" rx="7" fill="#f4f7f5" stroke="#e0e7e1" stroke-width="1.5" /><text x="726" y="337" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >V = 76</text><text x="854" y="337" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#223d43" text-anchor="start" font-weight="400" letter-spacing="3">01001100</text><rect x="708" y="373" width="411" height="53" rx="7" fill="#f4f7f5" stroke="#e0e7e1" stroke-width="1.5" /><text x="726" y="406" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2863b5" text-anchor="start" font-weight="700" >B = 38</text><text x="854" y="406" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#223d43" text-anchor="start" font-weight="400" letter-spacing="3">00100110</text><text x="736" y="491" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >24 bits / pixel = 3 octets / pixel</text><text x="736" y="527" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#72858d" text-anchor="start" font-weight="400" >2²⁴ = 16 777 216 couleurs possibles</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Taille brute d’une image RVB 24 bits</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >4 000 × 3 000 = 12 000 000 pixels.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Mémoire = 12 000 000 × 24 = 288 000 000 bits.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Soit 36 000 000 octets ≈ 36 Mo (hors en-tête).</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Définition, résolution, compression</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Résolution = pixels / dimension en pouces.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >4 000 pixels sur 20 cm → 508 pixels par pouce.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >PNG : sans perte ; JPEG : perte, taille variable.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Les couleurs distinguent les trajets ou les éléments, pas toujours la couleur de la lumière.</text></svg>