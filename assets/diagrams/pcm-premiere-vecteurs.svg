<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Vecteur position et vecteur vitesse</title><desc id="desc">La position part de l’origine du repère ; la vitesse est tangente à la trajectoire au point étudié.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >PCM · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Vecteur position et vecteur vitesse</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >La position part de l’origine du repère ; la vitesse est tangente à la trajectoire au point étudié.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="71" y="183" width="510" height="353" rx="12" fill="#f7faf8" stroke="#e0e7e2" stroke-width="1.5" /><path d="M152 455L541 455" stroke="#72858d" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><path d="M152 455L152 226" stroke="#72858d" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="153" y="484" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#72858d" text-anchor="start" font-weight="400" >O</text><text x="532" y="484" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#72858d" text-anchor="start" font-weight="400" >x</text><text x="170" y="239" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#72858d" text-anchor="start" font-weight="400" >y</text><path d="M152 455L456 268" stroke="#28776e" stroke-width="3.3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)" /><circle cx="456" cy="268" r="7" fill="#28776e" stroke="#28776e" stroke-width="2" /><path d="M456 268L456 455" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" /><path d="M152 268L456 268" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" /><text x="472" y="268" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >G</text><text x="456" y="489" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="400" >xG</text><text x="112" y="274" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="400" >yG</text><text x="287" y="337" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="start" font-weight="700" >OG</text><text x="277" y="331" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#28776e" text-anchor="start" font-weight="400" >→</text><rect x="612" y="183" width="517" height="353" rx="12" fill="#f7faf8" stroke="#e0e7e2" stroke-width="1.5" /><path d="M680 460Q770 200 1080 420" stroke="#72858d" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="787.2" cy="328.8" r="7" fill="#28776e" stroke="#28776e" stroke-width="2" /><path d="M787.2 328.8L957.2 263.8561797752809" stroke="#2863b5" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)" /><text x="770.2" y="312.8" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="end" font-weight="700" >G</text><text x="947" y="248" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2863b5" text-anchor="start" font-weight="700" >vG tangent</text><text x="764" y="481" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#28776e" text-anchor="middle" font-weight="700" >Sens de la vitesse = sens du mouvement</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Vecteur position</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >OG = xG × ex + yG × ey.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ses coordonnées sont des longueurs : m.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >L’origine O doit être explicitement indiquée.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Vitesse et accélération</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >v = d(OG) / dt ; a = dv / dt.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >v en m·s⁻¹ ; a en m·s⁻².</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Ne pas confondre la trajectoire avec le vecteur vitesse.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>