<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"><rect width="1000" height="460" fill="#fffdf7"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#285f65"/></marker></defs><g font-family="sans-serif" font-size="22" fill="#285f65"><text x="45" y="60" font-size="22">Capteur : la grandeur électrique répond à la grandeur physique</text><rect x="350" y="130" width="300" height="115" rx="12" fill="#e3eeeb" stroke="#285f65" stroke-width="2"/><text x="440" y="195" font-size="28">CAPTEUR</text><path d="M80 187L335 187" stroke="#285f65" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M665 187L920 187" stroke="#285f65" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="85" y="145" font-size="22">Entrée E</text><text x="745" y="145" font-size="22">Sortie S</text><text x="80" y="275" font-size="22">Température, force…</text><text x="710" y="275" font-size="22">R, U ou I…</text><text x="95" y="350" font-size="22">S = aE + b : sensibilité k = a, unité sortie / entrée</text><text x="95" y="405" font-size="22">Si E = cS + d, alors k = 1/c : attention aux axes !</text></g></svg>