<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Absorbance, transmission et loi de Beer-Lambert</title><desc id="desc">A est sans unité ; une proportionnalité à la concentration exige des conditions expérimentales fixées.</desc><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2863b5"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#28776e"/></marker><marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#72858d"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#c75454"/></marker><marker id="arr-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bb7a18"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#d2dde1"/><stop offset=".5" stop-color="#f4f7f8"/><stop offset="1" stop-color="#a9bdc5"/></linearGradient><linearGradient id="glass" x2="1" y2="0"><stop stop-color="#9accdf" stop-opacity=".7"/><stop offset=".5" stop-color="#e6f6fc" stop-opacity=".7"/><stop offset="1" stop-color="#83bed6" stop-opacity=".7"/></linearGradient></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f5f0" stroke="none" stroke-width="1.5" /><rect x="22" y="22" width="1156" height="756" rx="22" fill="#fffefa" stroke="#dbe2dd" stroke-width="1.5" /><text x="48" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#28776e" text-anchor="start" font-weight="700" >CDD · PREMIÈRE</text><text x="48" y="104" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#223d43" text-anchor="start" font-weight="700" >Absorbance, transmission et loi de Beer-Lambert</text><text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="start" font-weight="400" >A est sans unité ; une proportionnalité à la concentration exige des conditions expérimentales fixées.</text><rect x="44" y="160" width="1112" height="406" rx="16" fill="#ffffff" stroke="#e3e8e7" stroke-width="1.5" /><rect x="69" y="181" width="500" height="365" rx="12" fill="#f7faf8" stroke="#e0e7e3" stroke-width="1.5" /><text x="87" y="213" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="start" font-weight="700" >RADIATION TRAVERSANT LA SOLUTION</text><rect x="275" y="272" width="91" height="173" rx="2" fill="url(#glass)" stroke="#72858d" stroke-width="1.5" /><rect x="280" y="314" width="81" height="125" rx="0" fill="#649dc9" stroke="none" stroke-width="1.5" fill-opacity=".65"/><path d="M103 357L261 357" stroke="#bb7a18" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><path d="M379 357L524 357" stroke="#bb7a18" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gold)" /><text x="176" y="324" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#bb7a18" text-anchor="middle" font-weight="700" >I₀</text><text x="455" y="324" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#bb7a18" text-anchor="middle" font-weight="700" >I</text><path d="M276 469L276 485" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M365 469L365 485" stroke="#72858d" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M276 477L365 477" stroke="#72858d" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" marker-start="url(#arr-gray)"/><rect x="304.2" y="452" width="32.6" height="25" rx="4" fill="#fff" stroke="none" stroke-width="1.5" /><text x="320.5" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#72858d" text-anchor="middle" font-weight="700" >ℓ</text><text x="318" y="232" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#28776e" text-anchor="middle" font-weight="700" >Longueur d’onde λ fixée</text><text x="318" y="532" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#28776e" text-anchor="middle" font-weight="700" >T = I/I₀       A = −log₁₀(T)</text><path d="M660 489L1095 489" stroke="#72858d" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><path d="M660 489L660 230" stroke="#72858d" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-gray)" /><text x="646" y="214" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#28776e" text-anchor="middle" font-weight="700" >A</text><text x="1095" y="523" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#28776e" text-anchor="middle" font-weight="700" >c</text><path d="M660 489L1003 286" stroke="#2863b5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M1003 286Q1053 263 1090 259" stroke="#c75454" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><text x="885" y="236" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#28776e" text-anchor="middle" font-weight="700" >A = ελ ℓ c</text><text x="880" y="452" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2863b5" text-anchor="middle" font-weight="700" >Domaine linéaire</text><text x="1026" y="353" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c75454" text-anchor="middle" font-weight="700" >Limite à vérifier</text><text x="881" y="555" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#72858d" text-anchor="middle" font-weight="400" >Modèle illustratif ; aucun seuil universel.</text><rect x="44" y="587" width="542" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="44" y="587" width="5" height="156" rx="2" fill="#28776e" stroke="none" stroke-width="1.5" /><text x="64" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#28776e" text-anchor="start" font-weight="700" >Interpréter les intensités</text><text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >I et I₀ mesurées avec la même géométrie optique.</text><text x="64" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Une grande A correspond à une faible transmission.</text><text x="64" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >A = 1 → T = 0,10, soit 10 % de lumière transmise.</text><rect x="606" y="587" width="550" height="156" rx="12" fill="#f1f6f3" stroke="#d7e2dc" stroke-width="1.5" /><rect x="606" y="587" width="5" height="156" rx="2" fill="#2863b5" stroke="none" stroke-width="1.5" /><text x="626" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2863b5" text-anchor="start" font-weight="700" >Appliquer la loi dans son domaine</text><text x="626" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Fixer λ, ℓ et la nature de l’espèce absorbante.</text><text x="626" y="677" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Solution limpide ; interactions parasites limitées.</text><text x="626" y="703" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#223d43" text-anchor="start" font-weight="400" >Confirmer la gamme linéaire avec les étalons.</text><text x="48" y="771" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#72858d" text-anchor="start" font-weight="400" >Schéma pédagogique vectoriel · Montage de révision ; valeurs éventuelles explicitement illustratives.</text></svg>